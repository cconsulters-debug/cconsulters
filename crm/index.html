}
/* ------------------------------------------------------------------
   PDF-BERICHT – gleicher Aufbau wie die Word-Datei, als echte PDF
   gespeichert (kein Umweg über den Druckdialog).
   ------------------------------------------------------------------ */
async function vglPdfBlob(b){
  const d = pdfDoc();
  const f = n => n === null || n === undefined ? "–" : chf(n);
  const pz = n => (n * 100).toLocaleString("de-CH", { maximumFractionDigits:1 }) + " %";
  const diffTxt = z => z.diff === null ? "–" : (z.diff > 0 ? "+" : "") + chf(z.diff);
  const W = d.breite;
  const spaltenZahl = [
    { titel:"Position", w:W - 3 * 92, al:"left" },
    { titel:b.jahrAlt,  w:92, al:"right" },
    { titel:b.jahrNeu,  w:92, al:"right" },
    { titel:"Differenz",w:92, al:"right" }
  ];
  /* Kopf- und Fusszeile auf jeder Seite */
  const kopf = doc => {
    doc.text(b.kanzlei || "", doc.margin, { b:true, size:10 });
    doc.text(`Vergleich ${b.jahrAlt} / ${b.jahrNeu} · ${b.kunde}`, doc.margin, { al:"right", w:W, size:8.5, c:[0.33,0.38,0.48] });
    doc.y -= 8;
    doc.linie(doc.margin, doc.y, doc.margin + W, doc.y, 0.6);
    doc.y -= 20;
  };
  d.neueSeite(kopf);

  d.text(`Vergleich Steuererklärung ${b.jahrAlt} / ${b.jahrNeu}`, d.margin, { b:true, size:16 });
  d.y -= 20;
  d.text(`${b.kunde}${b.mandat ? " · Mandat " + b.mandat : ""}${b.ort ? " · " + b.ort : ""}`, d.margin, { size:10 });
  d.y -= 13;
  d.text(`${b.kanzlei}${b.bearbeiter ? " · " + b.bearbeiter : ""} · erstellt am ${b.datum}`, d.margin,
         { size:8.5, c:[0.33,0.38,0.48] });
  d.y -= 24;

  d.text("Grundlagen", d.margin, { b:true, size:12 }); d.y -= 16;
  pdfTabelle(d, [{ titel:"Merkmal", w:W * 0.45, al:"left" }, { titel:"Wert", w:W * 0.55, al:"left" }], [
    { cells:["Kanton / Gemeinde", `${b.stat.kanton}${b.stat.gemeinde ? " · " + b.stat.gemeinde : ""}`] },
    { cells:["Tarif", b.stat.verheiratet ? "Verheiratetentarif" : "Grundtarif"] },
    { cells:["Kinder", String(b.stat.kinder || 0)] },
    { cells:["Steuerfüsse (Kanton / Gemeinde / Kirche)",
             `${vglNum(b.stat.fussKanton)} % / ${vglNum(b.stat.fussGemeinde)} % / ${vglNum(b.stat.fussKirche)} %`] },
    { cells:["Berechnungsart", b.rNeu.modus === "tarif" ? "Tarifberechnung"
             : `Grenzsatz-Schätzung (${vglNum(b.stat.grenzsatz)} %)`] }
  ], kopf);

  b.zeilen.forEach(g => {
    if(d.y < d.margin + 120) d.neueSeite(kopf);
    d.text(g.gruppe, d.margin, { b:true, size:12 }); d.y -= 16;
    pdfTabelle(d, spaltenZahl, g.items.map(z => ({
      cells:[`${z.ziffer !== "–" ? "Ziff. " + z.ziffer + " · " : ""}${z.label}`,
             chf(z.alt), chf(z.neu), diffTxt(z)] })), kopf);
  });

  if(d.y < d.margin + 140) d.neueSeite(kopf);
  d.text("Steuerbares Einkommen und Vermögen", d.margin, { b:true, size:12 }); d.y -= 16;
  pdfTabelle(d, [{ titel:"", w:W - 3 * 92, al:"left" }, ...spaltenZahl.slice(1)],
    b.ergebnis.map(z => ({ cells:[z.label, f(z.alt), f(z.neu), diffTxt(z)], b:z.stark,
                           fill:z.stark ? [0.96,0.97,0.99] : null })), kopf);

  if(b.steuern.length){
    if(d.y < d.margin + 140) d.neueSeite(kopf);
    d.text("Steuerbelastung", d.margin, { b:true, size:12 }); d.y -= 16;
    pdfTabelle(d, [{ titel:"", w:W - 3 * 92, al:"left" }, ...spaltenZahl.slice(1)],
      b.steuern.map(z => ({ cells:[z.label, f(z.alt), f(z.neu), diffTxt(z)], b:z.stark,
                            fill:z.stark ? [0.96,0.97,0.99] : null })), kopf);
    d.text(`Grenzsteuersatz ${b.jahrNeu}: ${pz(b.rNeu.grenzsatz)} · Durchschnittssatz: ${pz(b.rNeu.durchschnitt || 0)}`,
           d.margin, { size:8.5, c:[0.33,0.38,0.48] });
    d.y -= 22;
  }

  if(b.szenarien.length){
    if(d.y < d.margin + 140) d.neueSeite(kopf);
    d.text(`Wirkung zusätzlicher Einzahlungen ${b.jahrNeu}`, d.margin, { b:true, size:12 }); d.y -= 16;
    const sw = [W - 5 * 78, 78, 78, 78, 78, 78];
    pdfTabelle(d, ["Variante","Säule 3a","PK-Einkauf","Einsatz","Ersparnis","in %"]
      .map((t,i) => ({ titel:t, w:sw[i], al:i ? "right" : "left" })),
      b.szenarien.map(s => ({ cells:[s.label || "Variante", chf(vglNum(s.s3a)), chf(vglNum(s.pk)),
        chf(s.einsatz), chf(s.ersparnis), pz(s.quote)] })), kopf);
  }
  if(b.staffel){
    if(d.y < d.margin + 120) d.neueSeite(kopf);
    d.text("Einkauf Pensionskasse: einmalig oder gestaffelt", d.margin, { b:true, size:12 }); d.y -= 16;
    pdfTabelle(d, [{ titel:"Variante", w:W * 0.5, al:"left" },
                   { titel:"Betrag pro Jahr", w:W * 0.25, al:"right" },
                   { titel:"Steuerersparnis total", w:W * 0.25, al:"right" }], [
      { cells:[`Einmalig im Jahr ${b.jahrNeu}`, chf(b.staffel.betrag), chf(b.staffel.einmalig)] },
      { cells:[`Gestaffelt über ${b.staffel.jahre} Jahre`, chf(b.staffel.proJahr), chf(b.staffel.gestaffelt)] },
      { cells:["Vorteil der Staffelung", "–", chf(b.staffel.vorteil)], b:true, fill:[0.96,0.97,0.99] }
    ], kopf);
  }

  if(b.notiz){
    if(d.y < d.margin + 100) d.neueSeite(kopf);
    d.text("Bemerkungen", d.margin, { b:true, size:12 }); d.y -= 16;
    d.y -= d.textBox(b.notiz, d.margin, W, { size:10 }) + 10;
  }

  if(d.y < d.margin + 110) d.neueSeite(kopf);
  d.text("Hinweise", d.margin, { b:true, size:11 }); d.y -= 14;
  b.hinweise.forEach(h => {
    if(d.y < d.margin + 40) d.neueSeite(kopf);
    d.text("·", d.margin, { size:8.5, c:[0.33,0.38,0.48] });
    d.y -= d.textBox(h, d.margin + 10, W - 10, { size:8.5, c:[0.33,0.38,0.48] }) + 3;
  });

  /* Seitenzahlen zum Schluss – erst jetzt ist die Gesamtzahl bekannt. */
  d.seitenzahlen();
  return d.blob();
}

async function vglExportWord(v){
  const b = vglBericht(v);
  toast("Word-Datei wird erstellt …");
  const blob = await vglDocxBlob(b);
  await download(blob, `Steuervergleich_${b.jahrAlt}-${b.jahrNeu}_${slug(b.kunde.replace(", ","-"))}.docx`);
}
async function vglExportPdf(v){
  const b = vglBericht(v);
  toast("PDF wird erstellt …");
  const blob = await vglPdfBlob(b);
  await download(blob, `Steuervergleich_${b.jahrAlt}-${b.jahrNeu}_${slug(b.kunde.replace(", ","-"))}.pdf`);
}
/* Standardausgabe: beide Formate nacheinander. */
async function vglExportBeide(v){
  const b = vglBericht(v);
  const name = `Steuervergleich_${b.jahrAlt}-${b.jahrNeu}_${slug(b.kunde.replace(", ","-"))}`;
  toast("Bericht wird erstellt – Word und PDF …");
  await download(await vglDocxBlob(b), name + ".docx");
  await download(await vglPdfBlob(b), name + ".pdf");
  toast("Bericht als Word und PDF gespeichert");
}

/* ---------- Druckbogen (= PDF über «Drucken → Als PDF sichern») ---------- */
function vglSheetHtml(b){
  const f = n => n === null || n === undefined ? "–" : chf(n);
  const d = z => z.diff === null ? "–" : `<span class="${z.diff > 0 ? "up" : z.diff < 0 ? "down" : ""}">${z.diff > 0 ? "+" : ""}${chf(z.diff)}</span>`;
  const pz = n => (n * 100).toLocaleString("de-CH", { maximumFractionDigits:1 }) + " %";
  const kopf = `<tr><th>Position</th><th class="num">${esc(b.jahrAlt)}</th>
                <th class="num">${esc(b.jahrNeu)}</th><th class="num">Differenz</th></tr>`;
  return `
  <div class="row" style="align-items:flex-start">
    <div><b style="font-size:16px">${esc(b.kanzlei || "")}</b><br>
      <span class="small">${esc(b.bearbeiter || "")}</span></div>
    <span class="spacer"></span>
    <div class="small" style="text-align:right">Erstellt am ${esc(b.datum)}</div>
  </div>
  <h2 style="margin:22px 0 4px">Vergleich Steuererklärung ${esc(b.jahrAlt)} / ${esc(b.jahrNeu)}</h2>
  <p class="small">${esc(b.kunde)}${b.mandat ? " · Mandat " + esc(b.mandat) : ""}${b.ort ? " · " + esc(b.ort) : ""}
     · ${esc(b.stat.kanton)}${b.stat.gemeinde ? " / " + esc(b.stat.gemeinde) : ""}
     · ${b.stat.verheiratet ? "Verheiratetentarif" : "Grundtarif"}
     · ${vglNum(b.stat.kinder)} Kind(er)</p>

  ${b.zeilen.map(g => `<h3 style="margin:18px 0 6px">${esc(g.gruppe)}</h3>
    <table><thead>${kopf}</thead><tbody>${g.items.map(z => `<tr>
      <td>${z.ziffer !== "–" ? `<span class="badge grey">${esc(z.ziffer)}</span> ` : ""}${esc(z.label)}</td>
      <td class="num">${chf(z.alt)}</td><td class="num">${chf(z.neu)}</td>
      <td class="num">${d(z)}</td></tr>`).join("")}</tbody></table>`).join("")}

  <h3 style="margin:18px 0 6px">Steuerbares Einkommen und Vermögen</h3>
  <table><thead>${kopf}</thead><tbody>${b.ergebnis.map(z => `<tr${z.stark ? ' class="stark"' : ""}>
    <td>${esc(z.label)}</td><td class="num">${f(z.alt)}</td><td class="num">${f(z.neu)}</td>
    <td class="num">${d(z)}</td></tr>`).join("")}</tbody></table>

  ${b.steuern.length ? `<h3 style="margin:18px 0 6px">Steuerbelastung</h3>
  <table><thead>${kopf}</thead><tbody>${b.steuern.map(z => `<tr${z.stark ? ' class="stark"' : ""}>
    <td>${esc(z.label)}</td><td class="num">${f(z.alt)}</td><td class="num">${f(z.neu)}</td>
    <td class="num">${d(z)}</td></tr>`).join("")}</tbody></table>
  <p class="small">Grenzsteuersatz ${esc(b.jahrNeu)}: <b>${pz(b.rNeu.grenzsatz)}</b> ·
     Durchschnittssatz: ${pz(b.rNeu.durchschnitt || 0)}</p>` : ""}

  ${b.szenarien.length ? `<h3 style="margin:18px 0 6px">Wirkung zusätzlicher Einzahlungen ${esc(b.jahrNeu)}</h3>
  <table><thead><tr><th>Variante</th><th class="num">Säule 3a</th><th class="num">PK-Einkauf</th>
    <th class="num">Einsatz</th><th class="num">Steuerersparnis</th><th class="num">in % des Einsatzes</th></tr></thead>
  <tbody>${b.szenarien.map(s => `<tr><td>${esc(s.label || "Variante")}</td>
    <td class="num">${chf(vglNum(s.s3a))}</td><td class="num">${chf(vglNum(s.pk))}</td>
    <td class="num">${chf(s.einsatz)}</td><td class="num"><b>${chf(s.ersparnis)}</b></td>
    <td class="num">${pz(s.quote)}</td></tr>`).join("")}</tbody></table>` : ""}

  ${b.staffel ? `<h3 style="margin:18px 0 6px">Einkauf Pensionskasse: einmalig oder gestaffelt</h3>
  <table><thead><tr><th>Variante</th><th class="num">Betrag pro Jahr</th><th class="num">Steuerersparnis total</th></tr></thead>
  <tbody>
    <tr><td>Einmalig im Jahr ${esc(b.jahrNeu)}</td><td class="num">${chf(b.staffel.betrag)}</td>
        <td class="num">${chf(b.staffel.einmalig)}</td></tr>
    <tr><td>Gestaffelt über ${b.staffel.jahre} Jahre</td><td class="num">${chf(b.staffel.proJahr)}</td>
        <td class="num">${chf(b.staffel.gestaffelt)}</td></tr>
    <tr class="stark"><td>Vorteil der Staffelung</td><td class="num">–</td>
        <td class="num">${chf(b.staffel.vorteil)}</td></tr>
  </tbody></table>` : ""}

  ${b.notiz ? `<h3 style="margin:18px 0 6px">Bemerkungen</h3><p>${esc(b.notiz).replace(/\n/g,"<br>")}</p>` : ""}
  <h3 style="margin:18px 0 6px">Hinweise</h3>
  <ul class="small" style="padding-left:18px">${b.hinweise.map(h => `<li>${esc(h)}</li>`).join("")}</ul>`;
}

/* ---------- Ansicht: Steuervergleich ---------- */
function viewVergleich(){
  if(!S.clientId && S.clients.length) S.clientId = S.clients[0].id;
  const c = clientById(S.clientId);
  if(!c){ M().innerHTML = `<div class="empty">Bitte zuerst einen Kunden erfassen.
    <br><button class="btn-primary" id="n" style="margin-top:10px">+ Neuer Kunde</button></div>`;
    $("#n").onclick = () => newClient(); return; }
  const jahr = String(S.jahr || S.settings.jahr);
  const v = vergleichOf(c.id, jahr);
  if(!v){
    M().innerHTML = `
    <div class="page-head"><div><h1>Steuervergleich ${esc(clientName(c))}</h1>
      <p>Gegenüberstellung der letzten und der neuen Steuererklärung – mit der Wirkung von
         Säule 3a und Einkauf Pensionskasse. Ergebnis als Word-Datei oder PDF.</p></div>
      <div class="row no-print">
        <select id="vglClient" style="width:auto">${S.clients.map(x =>
          `<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(clientName(x))}</option>`).join("")}</select>
        <select id="vglYear" style="width:auto">${yearOptions(jahr)}</select>
      </div></div>
    <div class="empty"><h3>Noch kein Vergleich für ${esc(jahr)}</h3>
      <p class="small">Der Vergleich stellt ${+jahr - 1} und ${esc(jahr)} nebeneinander.
         Ist bereits ein Vergleich des Vorjahres erfasst, werden dessen neue Werte automatisch als Vorjahr übernommen.</p>
      <button class="btn-primary" id="vglNew" style="margin-top:10px">Vergleich ${esc(jahr)} anlegen</button></div>
    <div class="card"><div class="card-head"><h3>Oder direkt die Steuererklärung einlesen</h3>
      <span class="small">Legt den Vergleich automatisch an</span></div>
      ${vglDropHtml()}</div>
    ${vglScanCard({ jahrAlt:String(+jahr - 1), jahrNeu:String(jahr) })}`;
    $("#vglClient").onchange = e => go("vergleich", { clientId:e.target.value, jahr });
    $("#vglYear").onchange   = e => go("vergleich", { clientId:c.id, jahr:e.target.value });
    $("#vglNew").onclick = async () => { await ensureVergleich(c.id, jahr); render(); };
    vglBindDrop(c, jahr);
    vglBindScan(vergleichOf(c.id, jahr), c);
    return;
  }

  const st = v.stat, b = vglBericht(v);
  const rA = b.rAlt, rN = b.rNeu, tarif = rN.modus === "tarif";
  const kt = KT_TARIF(st.kanton);
  const diffStb = rN.stbKanton - rA.stbKanton;
  const diffSteuer = tarif ? rN.total - rA.total : diffStb * (rN.grenzsatz || 0);
  const pz = n => (n * 100).toLocaleString("de-CH", { maximumFractionDigits:1 }) + " %";
  const cell = (seite, key) => `<input class="num vgl-in" data-seite="${seite}" data-key="${key}"
      value="${esc(v.daten[seite]?.[key] ?? "")}" placeholder="0" inputmode="decimal">`;

  M().innerHTML = `
  <div class="page-head">
    <div><h1>Steuervergleich ${esc(clientName(c))} · ${esc(v.jahrAlt)} → ${esc(v.jahrNeu)}</h1>
      <p>Positionen der beiden Steuererklärungen nebeneinander, inklusive Steuerwirkung geplanter
         Einzahlungen in die Säule 3a und Einkäufe in die Pensionskasse.</p></div>
    <div class="row no-print">
      <select id="vglClient" style="width:auto">${S.clients.map(x =>
        `<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(clientName(x))}</option>`).join("")}</select>
      <select id="vglYear" style="width:auto">${yearOptions(jahr)}</select>
      <button class="btn-primary" id="vglBeide">Bericht erstellen (Word + PDF)</button>
      <button class="btn-teal btn-sm" id="vglWord">nur Word</button>
      <button class="btn-teal btn-sm" id="vglPdf">nur PDF</button>
      <button class="btn-sm" id="vglPrint">Drucken</button>
    </div>
  </div>

  <div class="card no-print"><div class="card-head"><h3>Grundlagen der Berechnung</h3>
    <div class="row">
      <button class="pill ${tarif ? "active" : ""}" data-modus="tarif">Tarifberechnung</button>
      <button class="pill ${tarif ? "" : "active"}" data-modus="grenzsatz">Grenzsatz-Schätzung</button>
    </div></div>
    ${tarif
      ? `<div class="hint">Rechnet mit den hinterlegten Tarifen (Stand ${TARIFE.meta.steuerjahr}).
           <b>Vor der Mandantenauswertung die Tarifwerte prüfen</b> – sie ändern jährlich.</div>`
      : `<div class="hint warn">Schnellmodus: Es wird keine Steuerlast berechnet, sondern die Wirkung
           über einen geschätzten Grenzsteuersatz. Für Kantone ohne hinterlegten Tarif der richtige Weg.</div>`}
    <div class="grid g4">
      <div><label>Kanton</label><select id="stKanton">${KANTONE.map(([k,n]) =>
        `<option value="${k}" ${st.kanton===k?"selected":""}>${k} – ${n}</option>`).join("")}</select></div>
      <div><label>Gemeinde</label><input id="stGemeinde" value="${esc(st.gemeinde||"")}"
        list="vglGemeinden" placeholder="z.B. Winterthur">
        <datalist id="vglGemeinden">${Object.keys((kt||{}).gemeinden||{}).map(g =>
          `<option value="${esc(g)}">`).join("")}</datalist></div>
      <div><label>Tarif</label><select id="stTarif">
        <option value="0" ${st.verheiratet?"":"selected"}>Grundtarif (alleinstehend)</option>
        <option value="1" ${st.verheiratet?"selected":""}>Verheiratetentarif</option></select></div>
      <div><label>Kinder (Sozialabzug)</label><input class="num" id="stKinder" value="${esc(st.kinder ?? 0)}"></div>
    </div>
    ${tarif ? `<div class="grid g4" style="margin-top:12px">
      <div><label>Steuerfuss Kanton %</label><input class="num" id="stFussK" value="${esc(st.fussKanton)}"></div>
      <div><label>Steuerfuss Gemeinde %</label><input class="num" id="stFussG" value="${esc(st.fussGemeinde)}"></div>
      <div><label>Steuerfuss Kirche %</label><input class="num" id="stFussKi" value="${esc(st.fussKirche)}"></div>
      <div><label>&nbsp;</label><button id="stFuessePreset" ${kt && st.gemeinde && (kt.gemeinden||{})[st.gemeinde] ? "" : "disabled"}>Steuerfüsse der Gemeinde übernehmen</button></div>
    </div>
    <div class="grid g4" style="margin-top:12px">
      <div><label>Kinderabzug Kanton</label><input class="num" id="stKaK" value="${esc(st.kinderabzugKanton)}"></div>
      <div><label>Kinderabzug Bund</label><input class="num" id="stKaB" value="${esc(st.kinderabzugBund)}"></div>
      <div><label>Verheiratetenabzug Kanton</label><input class="num" id="stVaK" value="${esc(st.verheiratetenabzugKanton)}"></div>
      <div><label>Verheiratetenabzug Bund</label><input class="num" id="stVaB" value="${esc(st.verheiratetenabzugBund)}"></div>
    </div>`
    : `<div class="grid g4" style="margin-top:12px">
      <div><label>Grenzsteuersatz % (Bund + Kanton + Gemeinde)</label>
        <input class="num" id="stGrenz" value="${esc(st.grenzsatz)}"></div>
      <div><label>&nbsp;</label><span class="small">Richtwert Mittelstand: 25–35 %.
        Steht eine Veranlagung zur Verfügung, ist der Satz daraus ablesbar.</span></div>
    </div>`}
    <div class="grid g4" style="margin-top:12px">
      <div><label>Maximum Säule 3a (mit PK)</label><input class="num" id="stMax3a" value="${esc(st.saeule3aMitPk)}"></div>
      <div><label>&nbsp;</label><button id="vglCopyAlt">Vorjahreswerte ins neue Jahr kopieren</button></div>
      <div><label>&nbsp;</label><button class="btn-danger" id="vglDel">Vergleich löschen</button></div>
    </div>
  </div>

  <div class="card no-print"><div class="card-head"><h3>Steuererklärung einlesen</h3>
    <span class="small">PDF oder Scan – die Positionen werden automatisch erkannt</span></div>
    ${vglDropHtml()}</div>
  ${vglScanCard(v)}

  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><b>${chf(rN.stbKanton)}</b><span>Steuerbares Einkommen ${esc(v.jahrNeu)}</span></div>
    <div class="kpi"><b>${diffStb >= 0 ? "+" : ""}${chf(diffStb)}</b><span>Veränderung gegenüber ${esc(v.jahrAlt)}</span></div>
    <div class="kpi"><b>${tarif ? chf(rN.total) : "–"}</b><span>Steuerbelastung ${esc(v.jahrNeu)}</span></div>
    <div class="kpi"><b>${diffSteuer >= 0 ? "+" : ""}${chf(diffSteuer)}</b>
      <span>${tarif ? "Mehr-/Minderbelastung" : "Geschätzte Steuerwirkung"}</span></div>
  </div>

  <div class="card no-print"><div class="card-head"><h3>Gegenüberstellung</h3>
    <span class="small">Beträge in CHF · leer = 0 · Grenzsteuersatz ${esc(v.jahrNeu)}: <b>${pz(rN.grenzsatz || 0)}</b></span></div>
    ${VGL_GRUPPEN.map(g => `
      <div class="reg-head"><b>${esc(g.titel)}</b></div>
      <table><thead><tr><th>Position</th><th class="num" style="width:150px">${esc(v.jahrAlt)}</th>
        <th class="num" style="width:150px">${esc(v.jahrNeu)}</th><th class="num" style="width:130px">Differenz</th></tr></thead>
        <tbody>${g.items.map(([k,label,ziffer]) => {
          const dz = vglNum(v.daten.neu?.[k]) - vglNum(v.daten.alt?.[k]);
          return `<tr><td>${ziffer !== "–" ? `<span class="badge grey">${esc(ziffer)}</span> ` : ""}${esc(label)}</td>
            <td class="num">${cell("alt", k)}</td><td class="num">${cell("neu", k)}</td>
            <td class="num ${dz > 0 ? "up" : dz < 0 ? "down" : ""}">${dz ? (dz > 0 ? "+" : "") + chf(dz) : "–"}</td></tr>`;
        }).join("")}</tbody></table>`).join("")}
  </div>

  <div class="card no-print"><div class="card-head"><h3>Einzahlungen durchrechnen</h3>
    <button class="btn-sm" id="szAdd">+ Variante</button></div>
    <p class="small">Jede Zeile rechnet die Steuerersparnis für das Jahr ${esc(v.jahrNeu)} –

/* ------------------------------------------------------------------
   STEUERERKLÄRUNG / VERANLAGUNG AUS PDF EINLESEN
   Nutzt dieselbe Textextraktion wie der Konverter (PDF ohne Internet,

   Position und – als Reserve – die Ziffer der Steuererklärung.
   Jeder Treffer wird mit Belegausschnitt angezeigt und muss bestätigt
   werden; nichts wird ungeprüft in den Vergleich geschrieben.
   ------------------------------------------------------------------ */
const VGL_PARSE = {

  e_uebrige:       { ziffer:"6",    keys:["uebrige einkuenfte"] },
  e_liegenschaft:  { ziffer:"7.1",  keys:["einkuenfte aus liegenschaften","eigenmietwert","liegenschaftenertrag","mietertrag","mietzinseinnahmen"] },

  a_berufsauslagen:{ ziffer:"11",   keys:["berufsauslagen","berufskosten"] },
  a_schuldzinsen:  { ziffer:"12.1", keys:["schuldzinsen"] },
  a_unterhalt:     { ziffer:"13.1", keys:["bezahlte unterhaltsbeitraege","unterhaltsbeitraege und rentenleistungen"] },
  a_saeule3a:      { ziffer:"14.1", keys:["gebundene selbstvorsorge","beitraege saeule 3a","saeule 3a","saeule 3 a"] },
  a_pkeinkauf:     { ziffer:"14.2", keys:["einkauf berufliche vorsorge","einkauf pensionskasse","einkaufsbeitraege","beitraege an die 2. saeule"] },
  a_praemien:      { ziffer:"15",   keys:["versicherungspraemien","praemien und zinsen von sparkapitalien","versicherungsabzug"] },
  a_liegenschaft:  { ziffer:"17",   keys:["liegenschaftenunterhalt","liegenschaftsunterhalt","unterhalt liegenschaften"] },
  a_uebrige:       { ziffer:"18",   keys:["weitere abzuege","uebrige abzuege"] },

  w_krankheit:     { ziffer:"22.1", keys:["krankheits- und unfallkosten","krankheitskosten"] },
  w_spenden:       { ziffer:"22.2", keys:["freiwillige zuwendungen","parteibeitraege","spenden"] },
  w_kinderbetreuung:{ ziffer:"25.1",keys:["kinderbetreuungskosten","kinderdrittbetreuung"] },
  w_uebrige:       { ziffer:"27",   keys:["weitere sozialabzuege"] },

  v_aktiven:       { ziffer:"33",   keys:["total der aktiven","total aktiven","bruttovermoegen","total vermoegen"] },
  v_schulden:      { ziffer:"34",   keys:["total schulden","privatschulden","schulden"] }
};
/* Kontrollwerte aus einer Veranlagung – dienen dem Abgleich, nicht der Erfassung. */
const VGL_KONTROLLE = {
  stbEinkommen: { label:"Steuerbares Einkommen (laut Beleg)", keys:["steuerbares einkommen"] },
  stbVermoegen: { label:"Steuerbares Vermögen (laut Beleg)",  keys:["steuerbares vermoegen"] },
  steuerTotal:  { label:"Steuerbetrag (laut Beleg)",          keys:["total staats- und gemeindesteuern","total der steuern","steuerbetrag total"] }
};

/* Ersten plausiblen Frankenbetrag nach einer Fundstelle lesen. */
function vglFindBetrag(t, ab, fenster = 120){
  const seg = t.slice(ab, ab + fenster);
  const re = /(?:chf\s*)?(\d{1,3}(?:['’ ]\d{3})+(?:[.,]\d{2})?|\d+[.,]\d{2}|\d{3,7}|0)(?![\d'’])/g;
  let m;
  while((m = re.exec(seg))){
    const roh = m[1];
    const trenner = /['’ ]/.test(roh), rappen = /[.,]\d{2}$/.test(roh);
    const wert = vglNum(roh);
    if(!trenner && !rappen && wert >= 1900 && wert <= 2100) continue;   // Jahreszahl, kein Betrag
    if(!(wert >= 0)) continue;                                         // eine erfasste 0 ist ein Wert
    return { wert, kontext: seg.slice(0, m.index + roh.length).trim().slice(-70) };
  }
  return null;
}
/* Eine Position im Belegtext suchen: Stichwort zuerst, Ziffer als Reserve. */
const vglWortAnfang = (t, i) => i === 0 || !/[a-z0-9]/.test(t[i-1]);
function vglSuchePosition(t, regel){
  let best = null;
  for(const k of regel.keys){
    let idx = t.indexOf(k);
    while(idx !== -1){
      const f = vglWortAnfang(t, idx) ? vglFindBetrag(t, idx + k.length) : null;
      if(f){
        const stufe = k.length >= 14 ? "sicher" : "pruefen";
        if(!best || (stufe === "sicher" && best.stufe !== "sicher")) best = { ...f, stufe, anker:k };
        if(best.stufe === "sicher") return best;
      }
      idx = t.indexOf(k, idx + k.length);
    }
  }
  if(!best && regel.ziffer){
    const z = regel.ziffer.replace(".", "\\.");
    /* Nach der Ziffer muss Text folgen ("14.1 Beiträge an …"). Ohne diese
       Bedingung würde in "18 900" die Ziffer 18 mit dem Betrag 900 gelesen.
       Summenzeilen ("18 Total der Abzüge") sind keine Position, sondern das
       Ergebnis – sie würden sonst doppelt gezählt. */
    const re = new RegExp("(?:^|[^\\d.,'’])" + z + "[\\s)]{1,3}(?!total\\b|summe\\b|zwischentotal\\b)[a-z]", "g");
    let m;
    while((m = re.exec(t))){
      const f = vglFindBetrag(t, m.index + m[0].length, 110);
      if(f){ best = { ...f, stufe:"pruefen", anker:"Ziff. " + regel.ziffer }; break; }
    }
  }
  return best;
}
function vglParseText(text){
  const t = normText(text);
  const treffer = [];
  for(const [key, regel] of Object.entries(VGL_PARSE)){
    const hit = vglSuchePosition(t, regel);
    if(hit) treffer.push({ key, label:VGL_LABEL[key], ziffer:VGL_ZIFF[key], use:true, ...hit });
  }
  const kontroll = {};
  for(const [key, regel] of Object.entries(VGL_KONTROLLE)){
    const hit = vglSuchePosition(t, { keys:regel.keys });
    if(hit) kontroll[key] = { label:regel.label, wert:hit.wert, kontext:hit.kontext };
  }
  const tt = t;
  const art = /veranlagung|einschaetzungsentscheid|schlussrechnung/.test(tt) ? "Veranlagung / Schlussrechnung"
            : /steuererklaerung|hauptformular/.test(tt) ? "Steuererklärung"
            : "Beleg";
  return { treffer, kontroll, art };
}

/* Datei einlesen: PDF-Text, bei Bedarf OCR, danach erkennen. */
async function vglIntake(files, c, jahr){
  const f = (files || [])[0];
  if(!f) return;
  const setStat = m => { const el = $("#vglStatus"); if(el) el.textContent = m; };
  setStat(`Lese ${f.name} …`);
  let text = "";
  try{ text = await pdfText(f); }catch(e){ text = ""; }
  if(!textUsable(text) && (isBild(f.name) || /\.pdf$/i.test(f.name))){
    try{
      setStat("Kein Text im PDF – Texterkennung (OCR) läuft …");
      text = await ocrFile(f, p => setStat(`Texterkennung: ${p} %`));
    }catch(e){ setStat(e.message); }
  }
  if(!textUsable(text)){
    S.vglScan = { name:f.name, file:f, treffer:[], kontroll:{},
      fehler:"Aus dieser Datei liess sich kein Text lesen. Bei einem Scan hilft OCR (Einstellungen → Texterkennung, braucht Internet); sonst die Werte von Hand erfassen." };
    render(); return;
  }
  const res = vglParseText(text);
  S.vglScan = { name:f.name, file:f, jahr: detectYear(text, f.name) || "", dossier:true, ...res };
  render();
  toast(res.treffer.length ? `${res.treffer.length} Positionen erkannt – bitte prüfen` : "Keine Positionen erkannt");
}
/* Erkannte Werte in eine Jahresspalte übernehmen. */
async function vglApplyScan(v, seite, c){
  const scan = S.vglScan; if(!scan) return;
  const ziel = v.daten[seite] = v.daten[seite] || {};
  let n = 0;
  scan.treffer.filter(t => t.use !== false).forEach(t => { ziel[t.key] = String(t.wert); n++; });
  if(Object.keys(scan.kontroll).length){
    v.kontroll = v.kontroll || {};
    v.kontroll[seite] = { quelle:scan.name, art:scan.art,
      ...Object.fromEntries(Object.entries(scan.kontroll).map(([k, x]) => [k, x.wert])) };
  }
  await vglSave(v);
  if(scan.dossier && scan.file && c){
    try{ await vglInsDossier(scan.file, c, seite === "alt" ? v.jahrAlt : v.jahrNeu); }
    catch(e){ toast("Ablage im Dossier nicht möglich: " + e.message); }
  }
  S.vglScan = null;
  render();
  toast(`${n} Werte in die Spalte ${seite === "alt" ? v.jahrAlt : v.jahrNeu} übernommen`);
}
/* Das eingelesene PDF zusätzlich im Dossier des Jahres ablegen. */
async function vglInsDossier(file, c, jahr){
  const t = DT.steuererklaerung;
  const doc = { id:uid(), clientId:c.id, jahr:String(jahr), origName:file.name, size:file.size,
                docType:t.id, register:t.reg, ziffer:zifferFor(t.id, c.kanton), unsicher:false,
                blob:file, newName:file.name, added:new Date().toISOString() };
  doc.newName = buildName(doc, c, 1);
  await dbPut("docs", doc);
  delete doc.blob;
  S.docs.push(doc);
  await ensureDossier(c.id, jahr);
  await renumber(c.id, jahr);
}
/* Drop-Zone und Dateiauswahl binden – in beiden Zuständen der Ansicht. */
function vglBindDrop(c, jahr){
  const drop = $("#vglDrop"); if(!drop) return;
  const nimm = async files => {
    if(!files.length) return;
    await ensureVergleich(c.id, jahr);
    await vglIntake(files, c, jahr);
  };
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => nimm([...e.dataTransfer.files]));
  $("#vglPick") && ($("#vglPick").onclick = () => $("#vglFile").click());
  $("#vglFile") && ($("#vglFile").onchange = e => nimm([...e.target.files]));
}

              ${t.stufe === "sicher" ? '<span class="badge ok">sicher</span>' : '<span class="badge warn">prüfen</span>'}</td>
          <td><input class="num" data-scanval="${i}" value="${esc(t.wert)}" inputmode="decimal"></td>
          <td class="small mono">…${esc(t.kontext)}</td></tr>`).join("")}</tbody></table>`
      : '<div class="hint warn">Es wurden keine bekannten Positionen gefunden. Der Beleg lässt sich trotzdem im Dossier ablegen; die Werte bitte von Hand erfassen.</div>'}
    ${Object.keys(s.kontroll).length ? `<h4 style="margin-top:14px">Kontrollwerte aus dem Beleg</h4>
      <table><tbody>${Object.entries(s.kontroll).map(([k,x]) =>

/* Bedienelemente der Prüfkarte binden. */
function vglBindScan(v, c){
  if(!S.vglScan) return;
  $("#scanX") && ($("#scanX").onclick = () => { S.vglScan = null; render(); });
  $$("[data-scanuse]").forEach(cb => cb.onchange = () => {
    S.vglScan.treffer[+cb.dataset.scanuse].use = cb.checked; });
  $$("[data-scanval]").forEach(inp => inp.onchange = () => {

const M = () => $("#main");
function go(view, opts={}){
  S.view = view;
  if(opts.clientId !== undefined) S.clientId = opts.clientId;
  if(opts.jahr !== undefined) S.jahr = opts.jahr;
  if(opts.invoiceId !== undefined) S.invoiceId = opts.invoiceId;
  $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view ||
    (view === "client" && b.dataset.view === "clients") ||
    (view === "invoice" && b.dataset.view === "invoices")));
  render();
  window.scrollTo(0,0);
}
function render(){
  const v = { dashboard:viewDashboard, clients:viewClients, client:viewClient, dossier:viewDossier,
              vergleich:viewVergleich, converter:viewConverter, invoices:viewInvoices, invoice:viewInvoice,
              mail:viewMail, settings:viewSettings }[S.view] || viewDashboard;

const yearOptions = sel => {
  const now = new Date().getFullYear(), out = [];
  for(let y = now; y >= now-8; y--) out.push(`<option value="${y}" ${String(sel)===String(y)?"selected":""}>${y}</option>`);

};

    for(const d of S.dossiers.filter(d => d.clientId === c.id)) await dbDel("dossiers", d.id);
    for(const r of S.invoices.filter(r => r.clientId === c.id)) await dbDel("invoices", r.id);
    for(const r of S.vergleiche.filter(r => r.clientId === c.id)) await dbDel("vergleiche", r.id);

    if(c.partner.vorname || c.partner.name) c.profil.partner_erwerb = c.profil.partner_erwerb || !!fd.get("pf_partner_erwerb");
    c.updated = today();
    await dbPut("clients", c);
    S.clients.sort((a,b) => (a.name||"").localeCompare(b.name||""));
    toast("Gespeichert");
    $("#saveHint").textContent = "Zuletzt gespeichert: " + new Date().toLocaleTimeString("de-CH");
  };
}

/* Dokument manuell einem anderen Register / Typ zuordnen. */
async function reclassifyDialog(docId){
  const d = await dbGet("docs", docId); if(!d) return;
  const kt = clientById(d.clientId)?.kanton || S.settings.kanton;
  const ok = await modal({ title:"Dokument neu zuordnen", ok:"Übernehmen", body:`
    <p class="small">${esc(d.origName)}</p>
    <label>Dokumenttyp</label>
    <select name="dt">${DOCTYPES.map(t => `<option value="${t.id}" ${t.id===d.docType?"selected":""}>
      ${REG[t.reg].nr} · ${esc(t.label)}${zifferFor(t.id, kt)!=="–"?" (Ziff. "+zifferFor(t.id, kt)+")":""}</option>`).join("")}</select>
    <div style="height:10px"></div>
    <label>Steuerjahr</label><select name="jahr">${yearOptions(d.jahr)}</select>` });
  if(!ok) return;
  const t = DT[dlgVal("dt")] || DT.sonstiges;
  const oldJahr = d.jahr;
  Object.assign(d, { docType:t.id, register:t.reg, ziffer:zifferFor(t.id, clientById(d.clientId)?.kanton),
                     jahr:dlgVal("jahr"), unsicher:false });
  await dbPut("docs", d);
  const i = S.docs.findIndex(x => x.id === d.id); if(i >= 0) S.docs[i] = d;
  await renumber(d.clientId, d.jahr);
  if(oldJahr !== d.jahr) await renumber(d.clientId, oldJahr);
  await ensureDossier(d.clientId, d.jahr);
  render(); toast("Zuordnung aktualisiert");
}

/* ------------------------------------------------------------------
   CHECKLISTE EXPORTIEREN – als Text für E-Mail/WhatsApp, als CSV für
   Excel, als PDF über die Druckansicht (unten .checklist-sheet).
   ------------------------------------------------------------------ */
function checklistText(c, jahr){
  const list = buildChecklist(c, jahr), st = checklistStats(list), dos = dossierOf(c.id, jahr);
  const kopf = [
    `CHECKLISTE STEUERERKLÄRUNG ${jahr}`,
    `${clientName(c)}${c.mandat ? " · Mandat " + c.mandat : ""}`,
    S.settings.kanzlei,
    dos?.frist ? `Einreichefrist: ${deAt(dos.frist)}` : null,
    `Stand ${deAt(today())}: ${st.done} von ${st.total} Punkten erledigt`,
    ""
  ].filter(Boolean).join("\n");
  let out = kopf;
  nachGruppen(list).forEach(([g, items]) => {
    out += `\n${g.toUpperCase()}\n`;
    items.forEach(i => {
      const box = i.na ? "[–]" : (i.done ? "[x]" : "[ ]");
      out += `  ${box} ${i.label}${i.ziffer !== "–" ? " (Ziff. " + i.ziffer + ")" : ""}`
           + (i.na ? " – nicht nötig" : "") + (i.note ? " – " + i.note : "") + "\n";
    });
  });
  if(st.open.length){
    out += `\nNOCH BENÖTIGT (${st.open.length}):\n`;
    st.open.forEach(i => out += `  - ${i.label}${i.ziffer !== "–" ? " (Ziff. " + i.ziffer + ")" : ""}\n`);
  } else out += "\nAlle Unterlagen liegen vor.\n";
  if(S.settings.email) out += `\nUnterlagen bitte an ${S.settings.email}`
    + (S.settings.telefon ? ` · Fragen: ${S.settings.telefon}` : "") + "\n";
  return out;
}
function checklistCsv(c, jahr){
  const list = buildChecklist(c, jahr);
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const zeilen = [["Gruppe","Unterlage","Status","Ziffer","Register-Nr","Register","Notiz","Kunde","Steuerjahr"]
    .map(q).join(";")];
  nachGruppen(list).forEach(([g, items]) => items.forEach(i => zeilen.push([g, i.label,
    i.na ? "nicht nötig" : (i.done ? "erhalten" : "offen"), i.ziffer, REG[i.reg]?.nr || "",
    REG[i.reg]?.label || i.reg, i.note, clientName(c), jahr].map(q).join(";"))));
  return "\uFEFF" + zeilen.join("\r\n");   // BOM, damit Excel die Umlaute richtig liest
}
const checklistFile = (c, jahr) => `Checkliste_${jahr}_${slug(clientName(c).replace(", ","-"))}`;

/* ZIP-Export: Ordner je Register, Dateien nach Schema benannt. */
async function exportZip(c, jahr){
  const blob = await dossierZipBlob(c, jahr);
  if(!blob) return toast("Keine Dokumente");
  download(blob, `Steuerdossier_${jahr}_${slug(clientName(c).replace(", ","-"))}.zip`);
  toast("Dossier exportiert");
}
async function dossierZipBlob(c, jahr){
  const docs = docsOf(c.id, jahr);
  if(!docs.length) return null;
  toast("ZIP wird erstellt…");
  const files = [];
  for(const d of docs){
    const full = await dbGet("docs", d.id);
    if(!full?.blob) continue;
    const r = REG[d.register] || REG.R99;
    const buf = new Uint8Array(await full.blob.arrayBuffer());
    files.push({ name:`${jahr}_${slug(clientName(c).replace(", ","-"))}/${r.nr}_${slug(r.label)}/${d.newName}`, data:buf });
  }
  const enc = new TextEncoder();
  const ordner = `${jahr}_${slug(clientName(c).replace(", ","-"))}`;
  files.push({ name:`${ordner}/00_Inhaltsverzeichnis.txt`, data:enc.encode(tocText(c, jahr)) });
  files.push({ name:`${ordner}/00_Checkliste.txt`, data:enc.encode(checklistText(c, jahr)) });
  return makeZip(files);
}
function tocText(c, jahr){
  const docs = docsOf(c.id, jahr), list = buildChecklist(c, jahr), st = checklistStats(list);
  let out = `STEUERDOSSIER ${jahr}\n${clientName(c)}${c.mandat ? " · Mandat " + c.mandat : ""}\n` +
            `${S.settings.kanzlei}\nErstellt am ${deAt(today())}\n\nINHALT\n`;
  REGISTERS.filter(r => docs.some(d => d.register === r.id)).forEach(r => {
    out += `\n${r.nr} · ${r.label}\n`;
    docs.filter(d => d.register === r.id).sort((a,b) => a.newName.localeCompare(b.newName))
        .forEach(d => out += `   ${d.newName}${d.ziffer !== "–" ? "   (Ziff. " + d.ziffer + ")" : ""}\n`);
  });
  out += `\n\nCHECKLISTE: ${st.done}/${st.total} erledigt\n`;
  st.open.forEach(i => out += `   OFFEN: ${i.label}${i.ziffer !== "–" ? " (Ziff. " + i.ziffer + ")" : ""}\n`);
  return out;
}
function printToc(c, jahr){
  const w = window.open("", "_blank");
  w.document.write(`<pre style="font:13px ui-monospace,monospace;white-space:pre-wrap">${esc(tocText(c, jahr))}</pre>`);
  w.document.close(); w.print();
}

/* Anhänge aus den Mails des Kunden auswählen und in die Warteschlange laden. */
async function gmailImportDialog(c, jahr){
  const stat = $("#status");
  try{
    if(stat) stat.textContent = "Durchsuche Gmail …";
    const found = await gmailFindAttachments(c.email, 12);
    if(stat) stat.textContent = "";
    if(!found.length) return toast("Keine Anhänge in Mails dieses Kunden gefunden");
    const ok = await modal({ title:`${found.length} Anhänge gefunden`, ok:"Ausgewählte übernehmen", wide:true, body:
      found.map((a,i) => `<label class="check"><input type="checkbox" name="ga_${i}" checked>
        <span><b>${esc(a.name)}</b> <span class="small">· ${kb(a.size)} · Betreff: ${esc(a.subject)}</span></span></label>`).join("") });
    if(!ok) return;
    const pick = found.filter((_,i) => $(`[name="ga_${i}"]`, $("#dlgBody"))?.checked !== false);
    const files = [];
    for(let i = 0; i < found.length; i++){
      if(!pick.includes(found[i])) continue;
      if(stat) stat.textContent = `Lade ${found[i].name} …`;
      files.push(await gmailGetAttachment(found[i].msgId, found[i].attId, found[i].name));
    }
    await intake(files, jahr);
    toast(files.length + " Anhänge geladen");
  }catch(e){ if(stat) stat.textContent = ""; toast("Gmail: " + e.message); }
}

/* Dateien einlesen, Text extrahieren, klassifizieren. */
async function intake(files, jahr){
  if(!files.length) return;
  const stat = $("#status");
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    if(stat) stat.textContent = `Lese ${i+1}/${files.length}: ${f.name} …`;
    let text = await pdfText(f);
    if(S.settings.ocr && !textUsable(text) && (isBild(f.name) || /\.pdf$/i.test(f.name))){
      try{
        if(stat) stat.textContent = `Texterkennung (OCR) läuft: ${f.name} …`;
        text = await ocrFile(f, pct => { if(stat) stat.textContent = `OCR ${f.name}: ${pct}%`; });
      }catch(e){ S.convMsg = e.message; if(stat) stat.textContent = e.message; }
    }
    const cl = classify(f.name, text);
    const t = DT[cl.docType];
    S.queue.push({ file:f, name:f.name, size:f.size, docType:t.id, register:t.reg,
                   ziffer:zifferFor(t.id, (clientById(S.clientId) || {}).kanton),
                   jahr: detectYear(text, f.name) || String(jahr),
                   sicher:cl.sicher, hits:cl.hits });
  }
  if(stat) stat.textContent = "";
  render();
}
async function applyQueue(c, jahr){
  const years = new Set(), proJahr = {};
  for(const q of S.queue){
    const doc = { id:uid(), clientId:c.id, jahr:String(q.jahr), origName:q.name, size:q.size,
                  docType:q.docType, register:q.register, ziffer:q.ziffer, unsicher:!q.sicher,
                  blob:q.file, newName:q.name, added:new Date().toISOString() };
    doc.newName = buildName(doc, c, 1);
    await dbPut("docs", doc);
    delete doc.blob;                 // Datei liegt in der Datenbank, nicht im Arbeitsspeicher
    S.docs.push(doc);
    years.add(String(q.jahr));
    proJahr[q.jahr] = (proJahr[q.jahr] || 0) + 1;
  }
  for(const y of years){ await ensureDossier(c.id, y); await renumber(c.id, y); }
  const n = S.queue.length; S.queue = [];
  const jahre = [...years].sort();
  /* Angezeigt wird das Jahr, in dem die meisten Belege gelandet sind –
     das ist das Dossier, an dem gerade gearbeitet wird. */
  const hauptJahr = Object.entries(proJahr).sort((a,b) => b[1]-a[1] || b[0].localeCompare(a[0]))[0]?.[0];
  toast(jahre.length > 1
    ? `${n} Dokumente abgelegt – verteilt auf die Steuerjahre ${jahre.join(" und ")}`
    : `${n} Dokumente abgelegt`);
  go("dossier", { clientId:c.id, jahr:hauptJahr || jahr });
}

    <p class="small">Dossier zuerst als ZIP exportieren, danach im E-Mail-Fenster anhängen –
      so verlassen die Kundendaten deinen Rechner nur bewusst und kontrolliert.</p>
    <button id="zipMail">Dossier ${jahr} als ZIP exportieren</button></div>`;
  $("#mailClient").onchange = e => go("mail", { clientId:e.target.value, jahr });
  $("#mailYear").onchange   = e => go("mail", { clientId:c.id, jahr:e.target.value });
  $$("[data-tpl]").forEach(b => b.onclick = () => { S.tpl = b.dataset.tpl; render(); });
  const get = () => ({ to:$("#mTo").value.trim(), su:$("#mSubj").value, bo:$("#mBody").value });
  $("#sendApi") && ($("#sendApi").onclick = async () => {
    const { to, su, bo } = get();
    if(!to) return toast("Keine Empfängeradresse");
    const msg = $("#sendMsg");
    try{
      msg.textContent = "Sende über Gmail …";
      const attachments = [];
      if($("#attachZip").checked){
        const blob = await dossierZipBlob(c, jahr);
        if(blob) attachments.push({ name:`Steuerdossier_${jahr}_${slug(clientName(c).replace(", ","-"))}.zip`, blob });
      }
      await gmailSend({ to, subject:su, body:bo, from:S.settings.gmailFrom || S.settings.email, attachments });
      msg.textContent = "Gesendet – die Mail liegt in deinem Gmail-Ordner «Gesendet».";
      const d = await ensureDossier(c.id, jahr);
      if(d.status === "neu") { d.status = "angefordert"; await dbPut("dossiers", d); }
      toast("E-Mail gesendet");
    }catch(e){ msg.textContent = "Fehler: " + e.message; }
  });
  $("#sendGmail").onclick = () => { const { to, su, bo } = get();
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to)}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`, "_blank"); };
  $("#sendMailto").onclick = () => { const { to, su, bo } = get();
    window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`; };
  $("#copyMail").onclick = () => { const { su, bo } = get();
    navigator.clipboard.writeText(su + "\n\n" + bo).then(() => toast("In Zwischenablage kopiert")); };
  $("#markSent").onclick = async () => { const d = await ensureDossier(c.id, jahr);
    d.status = "angefordert"; d.updated = today(); await dbPut("dossiers", d); toast("Status: Unterlagen angefordert"); };
  $("#zipMail").onclick = () => exportZip(c, jahr);
}

  $("#syncGo") && ($("#syncGo").onclick = async () => {
    const msg = $("#syncMsg");

      msg.textContent = "Melde an …";

      const r = await syncRun(t => msg.textContent = t);
      msg.textContent = `Fertig: ${r.up} hochgeladen, ${r.down} heruntergeladen.`;

    }catch(e){ msg.textContent = "Fehler: " + e.message; }
  });

  $("#syncAdopt") && ($("#syncAdopt").onclick = async () => {
    const msg = $("#syncMsg");
    try{
      msg.textContent = "Hole Schlüssel aus der Cloud …";
      await syncAdoptDevice($("#syncMail").value.trim(), $("#syncPass").value);
      msg.textContent = "Schlüssel übernommen – bitte mit dem Passwort des ersten Geräts entsperren.";
      SEC.meta = await loadSecMeta(); SEC.on = true; SEC.locked = true;
      S.clients = []; S.dossiers = []; S.docs = [];
      showLock("Passwort des ersten Geräts eingeben – danach synchronisieren.");
    }catch(e){ msg.textContent = "Fehler: " + e.message; }

  $("#expFull").onclick = () => exportBackup(true);
  $("#impJson").onclick = () => $("#impFile").click();

  $("#demoOn").onclick  = () => loadDemoData();
  $("#demoOff").onclick = () => removeDemoData();

  $("#wipe").onclick = async () => {
    if(!confirmBox("Wirklich ALLE Daten löschen? Vorher ein Backup exportieren!")) return;
    if(!confirmBox("Letzte Warnung: alle Kunden, Dossiers und Dokumente werden gelöscht.")) return;
    for(const st of ["clients","dossiers","docs","invoices","vergleiche"]) for(const r of await rawAll(st)) await rawDel(st, r.id);
    S.clients = []; S.dossiers = []; S.docs = []; S.invoices = []; S.vergleiche = [];
    toast("Alle Daten gelöscht"); go("dashboard");
  };
}

/* ---------- Backup (auf Wunsch passwortgeschützt) ---------- */
const blobToDataUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function backupPayload(withFiles){
  const docs = [];
  for(const d of S.docs){
    const meta = { ...d }; delete meta.blob;
    if(withFiles){ const full = await dbGet("docs", d.id);
      meta.file = full?.blob ? await blobToDataUrl(full.blob) : null; }
    docs.push(meta);
  }
  return { app:"steuer-crm", version:4, exported:new Date().toISOString(), withFiles,
           settings:S.settings, clients:S.clients, dossiers:S.dossiers, invoices:S.invoices,
           vergleiche:S.vergleiche, docs };
}
async function exportBackup(withFiles){
  let pass = null;
  if(SEC.on){
    const ok = await modal({ title:"Backup verschlüsseln", ok:"Exportieren", body:`
      <p class="small">Das Backup enthält Kundendaten. Vergib ein Passwort – ohne dieses ist die Datei nicht lesbar.</p>
      <label>Backup-Passwort (mind. 8 Zeichen)</label><input type="password" name="bp">
      <div style="height:8px"></div>
      <label class="check"><input type="checkbox" name="plain"> Unverschlüsselt exportieren (nicht empfohlen)</label>` });
    if(!ok) return;
    if(!dlgVal("plain")){
      pass = dlgVal("bp");
      if(String(pass).length < 8) return toast("Backup-Passwort zu kurz");
    }
  }
  toast("Backup wird erstellt …");
  const data = await backupPayload(withFiles);
  let blob;
  if(pass){
    const salt = b64e(randBytes(16)), iv = randBytes(12);
    const kek = await deriveKek(pass, salt, PBKDF2_ITER);
    const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, kek, new TextEncoder().encode(JSON.stringify(data)));
    blob = new Blob([JSON.stringify({ app:"steuer-crm", enc:1, iter:PBKDF2_ITER, salt,
      iv:b64e(iv), ct:b64e(ct) })], { type:"application/json" });
  } else {
    blob = new Blob([JSON.stringify(data, null, 1)], { type:"application/json" });
  }
  download(blob, `steuer-crm-backup_${today()}${withFiles ? "_mit-dateien" : ""}${pass ? "_verschluesselt" : ""}.json`);
}
async function importBackup(file){
  if(!file) return;
  let data; try{ data = JSON.parse(await file.text()); }catch(e){ return toast("Datei nicht lesbar"); }
  if(data.app !== "steuer-crm") return toast("Kein gültiges Backup");
  if(data.enc){
    const ok = await modal({ title:"Backup entschlüsseln", ok:"Einlesen",
      body:`<label>Backup-Passwort</label><input type="password" name="bp">` });
    if(!ok) return;
    try{
      const kek = await deriveKek(dlgVal("bp"), data.salt, data.iter);
      const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64d(data.iv) }, kek, b64d(data.ct));
      data = JSON.parse(new TextDecoder().decode(buf));
    }catch(e){ return toast("Falsches Backup-Passwort"); }
  }
  if(!confirmBox("Backup einlesen? Vorhandene Einträge mit gleicher ID werden überschrieben.")) return;
  for(const c of data.clients || []) await dbPut("clients", c);
  for(const d of data.dossiers || []) await dbPut("dossiers", d);
  for(const r of data.invoices || []) await dbPut("invoices", r);
  for(const r of data.vergleiche || []) await dbPut("vergleiche", r);
  for(const d of data.docs || []){
    const rec = { ...d };
    if(rec.file){ const r = await fetch(rec.file); rec.blob = await r.blob(); }
    delete rec.file;
    await dbPut("docs", rec);
  }
  if(data.settings){ S.settings = Object.assign(S.settings, data.settings); await saveSettings(); }
  await loadAll(); toast("Backup eingelesen"); go("dashboard");
}

/* ==================================================================
   GMAIL-ANBINDUNG (optional)
   Sendet über das Google-Konto der Kanzlei und liest Anhänge aus
   Kundenmails direkt in den Konverter ein. Voraussetzung: eigene
   OAuth-Client-ID (Anleitung in crm/SETUP-GMAIL.md) und Aufruf über
   https:// oder http://localhost – nicht über file://.
   ================================================================== */
const GMAIL_SCOPES = "https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.readonly";
const GM = { token:null, exp:0, tc:null };
const gmailReady = () => !!S.settings.gmailClientId && location.protocol !== "file:";
function gmailWhyNot(){
  if(!S.settings.gmailClientId) return "Es ist keine Google-Client-ID hinterlegt (Einstellungen → Gmail).";
  if(location.protocol === "file:") return "Google erlaubt die Anmeldung nur über https:// oder http://localhost – "
    + "diese Datei läuft lokal (file://). Für Gmail bitte die gehostete Version verwenden.";
  return "";
}
function loadScript(src){
  return new Promise((res, rej) => {
    if([...document.scripts].some(s => s.src === src)) return res(true);
    const el = document.createElement("script");
    el.src = src; el.onload = () => res(true); el.onerror = () => rej(new Error("Skript nicht geladen: " + src));
    document.head.appendChild(el);
  });
}
async function gmailToken(){
  if(GM.token && Date.now() < GM.exp - 60000) return GM.token;
  if(!gmailReady()) throw new Error(gmailWhyNot());
  await loadScript("https://accounts.google.com/gsi/client");
  return new Promise((res, rej) => {
    try{
      GM.tc = google.accounts.oauth2.initTokenClient({
        client_id: S.settings.gmailClientId,
        scope: GMAIL_SCOPES,
        callback: r => {
          if(r.error) return rej(new Error("Google-Anmeldung abgebrochen: " + r.error));
          GM.token = r.access_token; GM.exp = Date.now() + (r.expires_in || 3600) * 1000;
          res(GM.token);
        }
      });
      GM.tc.requestAccessToken({ prompt: GM.token ? "" : "consent" });
    }catch(e){ rej(e); }
  });
}
const b64url = str => btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64urlFromBytes = buf => b64e(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const chunk76 = str => str.replace(/(.{76})/g, "$1\r\n");
/* RFC-822-Nachricht mit optionalen Anhängen bauen. */
async function buildMime({ to, subject, body, from, attachments = [] }){
  const bound = "b" + Math.random().toString(36).slice(2);
  const head = [
    from ? `From: ${from}` : null,
    `To: ${to}`,
    `Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,
    "MIME-Version: 1.0",
    attachments.length ? `Content-Type: multipart/mixed; boundary="${bound}"`
                       : 'Content-Type: text/plain; charset="UTF-8"'
  ].filter(Boolean).join("\r\n");
  const utf8 = s => unescape(encodeURIComponent(s));
  if(!attachments.length) return head + "\r\nContent-Transfer-Encoding: base64\r\n\r\n" + chunk76(btoa(utf8(body)));
  let out = head + "\r\n\r\n--" + bound + "\r\n" +
            'Content-Type: text/plain; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n' +
            chunk76(btoa(utf8(body))) + "\r\n";
  for(const a of attachments){
    const bytes = new Uint8Array(await a.blob.arrayBuffer());
    out += "--" + bound + "\r\n" +
           `Content-Type: ${a.blob.type || "application/octet-stream"}; name="${a.name}"\r\n` +
           `Content-Disposition: attachment; filename="${a.name}"\r\n` +
           "Content-Transfer-Encoding: base64\r\n\r\n" + chunk76(b64e(bytes)) + "\r\n";
  }
  return out + "--" + bound + "--";
}
async function gmailSend(msg){
  const token = await gmailToken();
  const raw = b64urlFromBytes(new TextEncoder().encode(await buildMime(msg)));
  const r = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
    method:"POST", headers:{ Authorization:"Bearer " + token, "Content-Type":"application/json" },
    body: JSON.stringify({ raw })
  });
  if(!r.ok) throw new Error("Gmail: " + (await r.text()).slice(0,200));
  return r.json();
}
/* Anhänge aus den Mails eines Kunden holen (Standard: letzte 12 Monate). */
async function gmailFindAttachments(fromEmail, monate = 12){
  const token = await gmailToken();
  const after = new Date(Date.now() - monate * 30 * 86400000).toISOString().slice(0,10).replace(/-/g,"/");
  const q = `from:${fromEmail} has:attachment after:${after}`;
  const list = await (await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=25&q="
      + encodeURIComponent(q), { headers:{ Authorization:"Bearer " + token } })).json();
  const out = [];
  for(const m of (list.messages || [])){
    const full = await (await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=full`,
      { headers:{ Authorization:"Bearer " + token } })).json();
    const subj = (full.payload?.headers || []).find(h => h.name === "Subject")?.value || "";
    const walk = parts => (parts || []).forEach(p => {
      if(p.filename && p.body?.attachmentId)
        out.push({ msgId:m.id, attId:p.body.attachmentId, name:p.filename, size:p.body.size || 0, subject:subj });
      if(p.parts) walk(p.parts);
    });
    walk(full.payload?.parts);
  }
  return out;
}
async function gmailGetAttachment(msgId, attId, name){
  const token = await gmailToken();
  const r = await (await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msgId}/attachments/${attId}`,
    { headers:{ Authorization:"Bearer " + token } })).json();
  const bytes = b64d(String(r.data || "").replace(/-/g,"+").replace(/_/g,"/"));
  const type = /\.pdf$/i.test(name) ? "application/pdf" : "application/octet-stream";
  return new File([bytes], name, { type });
}

/* ==================================================================
   CLOUD-SYNCHRONISATION (optional, Ende-zu-Ende verschlüsselt)
   Es werden ausschliesslich bereits verschlüsselte Datensätze
   hochgeladen – der Anbieter sieht nur Zeitstempel und Grössen.
   Setzt aktivierte Verschlüsselung voraus.
   ================================================================== */
const SY = { fb:null, user:null, busy:false };
const syncCfg = () => { try{ return JSON.parse(S.settings.syncCfg || "null"); }catch(e){ return null; } };
async function syncInit(){
  if(SY.fb) return SY.fb;
  const cfg = syncCfg();
  if(!cfg) throw new Error("Keine Firebase-Konfiguration hinterlegt (Einstellungen → Synchronisation).");
  if(location.protocol === "file:") throw new Error("Synchronisation braucht https:// – lokal geöffnete Dateien können sich nicht anmelden.");
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  let app, auth, fs, stg;
  try{
    [app, auth, fs, stg] = await Promise.all([
      import(V + "firebase-app.js"), import(V + "firebase-auth.js"),
      import(V + "firebase-firestore.js"), import(V + "firebase-storage.js")
    ]);
  }catch(e){ throw new Error("Firebase-Bibliothek konnte nicht geladen werden – Internetverbindung prüfen."); }
  const a = app.initializeApp(cfg, "crm-sync");
  SY.fb = { app:a, auth:auth.getAuth(a), db:fs.getFirestore(a), storage:stg.getStorage(a), authM:auth, fsM:fs, stgM:stg };
  return SY.fb;
}
async function syncLogin(email, pass){
  const fb = await syncInit();
  const cred = await fb.authM.signInWithEmailAndPassword(fb.auth, email, pass);
  SY.user = cred.user;
  return SY.user;
}
const rawToCloud = r => ({ e:r.e ? 1 : 0, del:r.del ? 1 : 0, rev:r.rev || 0,
  iv:r.iv ? b64e(r.iv) : null, ct:r.ct ? b64e(r.ct) : null,
  fiv:r.fiv ? b64e(r.fiv) : null, ftype:r.ftype || null, hasFile:!!r.fct });
const cloudToRaw = (id, c) => { const r = { id, rev:c.rev || 0 };
  if(c.del){ r.del = 1; return r; }
  if(c.e){ r.e = 1; r.iv = b64d(c.iv); r.ct = b64d(c.ct).buffer; }
  if(c.fiv){ r.fiv = b64d(c.fiv); r.ftype = c.ftype; }
  return r; };
/* Zweites Gerät anmelden: holt den (mit dem Passwort verschlüsselten)
   Schlüsselcontainer aus der Cloud, danach entsperrt man wie gewohnt.   */
async function syncAdoptDevice(email, pass){
  const fb = await syncInit();
  await syncLogin(email, pass);
  const snap = await fb.fsM.getDoc(fb.fsM.doc(fb.db, "crm", SY.user.uid, "meta", "crypto"));
  if(!snap.exists()) throw new Error("In der Cloud liegt noch kein Schlüssel – zuerst auf dem ersten Gerät synchronisieren.");
  await saveSecMeta(snap.data().meta);
  return true;
}
async function syncMeta(fb, uid){
  const ref = fb.fsM.doc(fb.db, "crm", uid, "meta", "crypto");
  const snap = await fb.fsM.getDoc(ref);
  const local = SEC.meta || await loadSecMeta();
  if(!snap.exists() && local) await fb.fsM.setDoc(ref, { meta:local, rev:Date.now() });
  else if(snap.exists() && local && (snap.data().meta?.salt !== local.salt))
    await fb.fsM.setDoc(ref, { meta:local, rev:Date.now() });   // Passwortwechsel weitergeben
}
async function syncRun(onProgress = () => {}){
  if(SY.busy) return;
  if(!SEC.on) throw new Error("Synchronisation nur mit aktivierter Verschlüsselung – sonst lägen Kundendaten unverschlüsselt in der Cloud.");
  const fb = await syncInit();
  if(!SY.user) throw new Error("Nicht angemeldet (Einstellungen → Synchronisation → Anmelden).");
  SY.busy = true;
  const { fsM, stgM } = fb, uid = SY.user.uid;
  let up = 0, down = 0;
  try{
    await syncMeta(fb, uid);
    for(const store of ["clients","dossiers","docs","invoices","vergleiche"]){
      onProgress(`Gleiche ${store} ab …`);
      const local = await rawAll(store);
      const localById = Object.fromEntries(local.map(r => [r.id, r]));
      const snap = await fsM.getDocs(fsM.collection(fb.db, "crm", uid, store));
      const remote = {};
      snap.forEach(d => remote[d.id] = d.data());

      for(const [id, rc] of Object.entries(remote)){          // herunterladen
        const lc = localById[id];
        if(lc && (lc.rev || 0) >= (rc.rev || 0)) continue;
        const rec = cloudToRaw(id, rc);
        if(rc.hasFile && !rc.del){
          const url = await stgM.getDownloadURL(stgM.ref(fb.storage, `crm/${uid}/${store}/${id}`));
          rec.fct = await (await fetch(url)).arrayBuffer();
        }
        await rawPut(store, rec); down++;
      }
      for(const r of local){                                   // hochladen
        const rc = remote[r.id];
        if(rc && (rc.rev || 0) >= (r.rev || 0)) continue;
        if(r.fct && !r.del)
          await stgM.uploadBytes(stgM.ref(fb.storage, `crm/${uid}/${store}/${r.id}`), new Uint8Array(r.fct));
        await fsM.setDoc(fsM.doc(fb.db, "crm", uid, store, r.id), rawToCloud(r));
        up++;
      }
    }
    S.settings.lastSync = new Date().toISOString(); await saveSettings();
    await loadAll();
    return { up, down };
  } finally { SY.busy = false; }
}

        <div class="row" style="margin-top:12px">

      <p class="small">Die Daten sind mit AES-256 verschlüsselt. Ohne Passwort oder Wiederherstellungsschlüssel
         sind sie nicht lesbar – auch nicht für uns.</p>
    </div>`;
  const go = async () => {
    const pass = $("#lockPass").value;
    $("#lockMsg").textContent = "Entschlüssle …";
    if(await unlockWithPassword(pass)){ await afterUnlock(); }
    else $("#lockMsg").textContent = "Falsches Passwort.";
  };
  $("#lockGo").onclick = go;
  $("#lockPass").onkeydown = e => { if(e.key === "Enter") go(); };
  $("#lockRec").onclick = () => {
    $("#lockPane").innerHTML = `
      <label>Wiederherstellungsschlüssel</label>
      <input id="recKey" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off">
      <div style="height:8px"></div>
      <label>Neues Passwort</label>
      <input type="password" id="recPass" autocomplete="new-password">
      <div class="row" style="margin-top:12px">
        <button class="btn-primary" id="recGo">Entsperren &amp; Passwort neu setzen</button></div>`;
    $("#recGo").onclick = async () => {
      const k = $("#recKey").value, np = $("#recPass").value;
      if(np.length < 8) return $("#lockMsg").textContent = "Neues Passwort: mindestens 8 Zeichen.";
      $("#lockMsg").textContent = "Prüfe Schlüssel …";
      if(await unlockWithRecovery(k, np)) await afterUnlock();
      else $("#lockMsg").textContent = "Wiederherstellungsschlüssel stimmt nicht.";
    };
  };
  $("#lockPass").focus();
}
async function afterUnlock(){
  $("#lockScreen")?.remove();
  document.body.classList.remove("locked");
  await loadAll();
  touchIdle();
  go(S.view === "dashboard" ? "dashboard" : S.view);
}

(async function boot(){
  try{ db = await openDB(); }
  catch(e){
    M().innerHTML = `<div class="card"><h3>Speicher nicht verfügbar</h3>
      <p>Dieser Browser erlaubt keine lokale Datenbank (IndexedDB). Bitte Chrome oder Edge verwenden
         und den privaten Modus verlassen.</p></div>`;
    return;
  }
  const st = await rawGet("kv","settings");
  if(st && st.v) S.settings = Object.assign(S.settings, st.v);
  applyBranding();
  $$("#nav button").forEach(b => b.onclick = () => go(b.dataset.view));
  $("#dlgForm").addEventListener("submit", () => {});
  window.addEventListener("keydown", e => { if(e.key === "Escape" && $("#dlg").open) $("#dlg").close("cancel"); });
  ["click","keydown","mousemove","touchstart"].forEach(ev =>
    window.addEventListener(ev, touchIdle, { passive:true }));

  SEC.meta = await loadSecMeta();
  if(SEC.meta){ SEC.on = true; SEC.locked = true; showLock(); return; }   // erst entsperren
  await loadAll();
  go("dashboard");
})();
</script>
