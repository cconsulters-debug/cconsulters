<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3864'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='bold' fill='%230f8fa3' text-anchor='middle'%3E%E2%82%A3%3C/text%3E%3C/svg%3E">
<title>Steuer-CRM · C Consulters</title>
<style>
/* ==================================================================
   Steuer-CRM – privates CRM für Steuerkunden
   Farbwelt abgestimmt auf das "Steuerdossier"-E-Book (Navy/Teal).
   Alles läuft lokal im Browser – keine Serverübertragung.
   ================================================================== */
:root{
  --navy:#1F3864; --navy-700:#2b4a7d; --teal:#0f8fa3; --teal-600:#0c7789;
  --bg:#f4f6f9; --panel:#ffffff; --panel-2:#f9fafc;
  --ink:#141b26; --ink-dim:#54617a; --ink-faint:#8a95a8;
  --line:#dfe4ec; --line-strong:#c6cedd;
  --ok:#0f8a4d; --ok-bg:#e6f6ed; --warn:#b26a00; --warn-bg:#fdf3e2;
  --danger:#c02626; --danger-bg:#fdeaea; --info-bg:#eaf2fb;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 20px rgba(16,24,40,.06);
  --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:21px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13.5px}
p{margin:0 0 10px}
a{color:var(--teal-600)}
small,.small{font-size:12.5px;color:var(--ink-dim)}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{background:var(--navy);color:#e8eef8;padding:18px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#4A7DBF);display:grid;place-items:center;font-weight:800;color:#04141a;font-size:14px}
.brand b{font-size:14.5px;display:block;line-height:1.2}
.brand span{font-size:11.5px;color:#9fb3d4}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 11px;border-radius:8px;color:#cfdcf0;font-size:14px;display:flex;align-items:center;gap:9px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.active{background:#fff;color:var(--navy);font-weight:600}
.nav .ico{width:18px;text-align:center}
.side-foot{margin-top:auto;font-size:11.5px;color:#9fb3d4;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.main{padding:22px 26px 60px;max-width:1180px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--ink-dim);font-size:13.5px;max-width:70ch}

/* ---------- Bausteine ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card>h3{margin-bottom:4px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

button,.btn{font-family:inherit;font-size:13.5px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);padding:8px 13px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
button:hover,.btn:hover{background:var(--panel-2);border-color:var(--ink-faint)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-700);border-color:var(--navy-700)}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-600);border-color:var(--teal-600)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-dim)}
.btn-danger{color:var(--danger);border-color:#eccaca}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{padding:5px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:not-allowed}

label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-dim);margin-bottom:4px}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,143,163,.35);outline-offset:1px;border-color:var(--teal)}
textarea{min-height:80px;resize:vertical}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;font-weight:500;color:var(--ink);margin:0 0 6px}
.check input{width:auto;margin-top:2px;accent-color:var(--teal)}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 12px}
legend{font-size:12.5px;font-weight:700;color:var(--navy);padding:0 6px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--info-bg);color:var(--navy);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.grey{background:#eef1f5;color:var(--ink-dim)}
.pill{border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px;font-size:12.5px;background:#fff;cursor:pointer}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.empty{text-align:center;padding:34px 16px;color:var(--ink-dim);border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--panel-2)}
.hint{background:var(--info-bg);border-left:3px solid var(--navy);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--ink);margin:0 0 12px}
.hint.warn{background:var(--warn-bg);border-color:var(--warn)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.kpi b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-dim)}
.progress{height:7px;border-radius:999px;background:#e8ecf3;overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal);transition:width .25s}

.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:28px;text-align:center;background:var(--panel-2);transition:.15s}
.drop.over{border-color:var(--teal);background:#eefafc}
.doc-row{display:grid;grid-template-columns:1fr 210px 150px 92px;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:6px}
@media(max-width:900px){.doc-row{grid-template-columns:1fr}}
.doc-row .fn{font-size:13px;overflow-wrap:anywhere}
.reg-head{display:flex;align-items:center;gap:8px;margin:16px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--navy)}
.reg-head b{font-size:14px} .reg-head .badge{margin-left:auto}

dialog{border:none;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(16,24,40,.28);width:min(760px,94vw);color:var(--ink)}
dialog::backdrop{background:rgba(15,22,36,.5)}
.dlg-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-body{padding:18px;max-height:70vh;overflow:auto}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2);border-radius:0 0 14px 14px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:none}
.hidden{display:none !important}

/* Sperrbildschirm */
body.locked .app{filter:blur(7px);pointer-events:none;user-select:none}
#lockScreen{position:fixed;inset:0;background:rgba(15,22,36,.62);display:grid;place-items:center;z-index:200}
.lock-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(430px,92vw);box-shadow:0 24px 70px rgba(0,0,0,.4)}
.keybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;letter-spacing:.06em;background:var(--panel-2);
        border:1px dashed var(--line-strong);border-radius:8px;padding:12px;text-align:center;word-break:break-all}

.invoice-sheet{padding:26px}
.vgl-sheet{padding:26px}
.vgl-sheet h3{margin-top:18px}
.vgl-sheet tr.stark td{font-weight:700;background:var(--panel-2)}
.up{color:var(--warn)} .down{color:var(--ok)}
.vgl-in{padding:5px 8px;font-size:13.5px}
.print-sheet{display:none}
.print-sheet .box{display:inline-block;width:13px;height:13px;border:1.4px solid #444;border-radius:2px;
  margin-right:8px;vertical-align:-1px;text-align:center;line-height:12px;font-size:11px}
.print-sheet .zeile{padding:3px 0;border-bottom:1px dotted #ccc}
.print-sheet .erledigt{color:#555}
.print-sheet .na{color:#999;text-decoration:line-through}
@media print{
  .side,.no-print,button,.toast,dialog{display:none !important}
  body.view-invoice .page-head,
  body.view-invoice .card:not(.invoice-sheet){display:none !important}
  body.view-invoice .invoice-sheet{border:none;padding:0}
  body.view-vergleich .page-head,
  body.view-vergleich .card:not(.vgl-sheet){display:none !important}
  body.view-vergleich .vgl-sheet{border:none;padding:0}
  .vgl-sheet table{break-inside:auto}
  body.view-dossier .page-head,
  body.view-dossier .grid,
  body.view-dossier .card:not(.print-sheet){display:none !important}
  body.view-dossier .print-sheet{display:block;border:none;padding:0;box-shadow:none}
  .app{display:block} .main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body{background:#fff;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side no-print">
    <div class="brand">
      <div class="logo">CC</div>
      <div><b id="brandName">Steuer-CRM</b><span id="brandSub">C Consulters</span></div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="ico">◧</span> Übersicht</button>
      <button data-view="clients"><span class="ico">☺</span> Kunden</button>
      <button data-view="dossier"><span class="ico">▤</span> Dossier &amp; Checkliste</button>
      <button data-view="vergleich"><span class="ico">⇅</span> Steuervergleich</button>
      <button data-view="converter"><span class="ico">⇄</span> Dokumenten-Konverter</button>
      <button data-view="invoices"><span class="ico">₣</span> Honorar &amp; Rechnungen</button>
      <button data-view="mail"><span class="ico">✉</span> E-Mail-Vorlagen</button>
      <button data-view="settings"><span class="ico">⚙</span> Einstellungen &amp; Backup</button>
    </nav>
    <div class="side-foot">
      Alle Daten bleiben lokal in diesem Browser.<br>
      <span id="storageInfo">–</span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm">
  <div class="dlg-head"><h2 id="dlgTitle">Titel</h2><button class="btn-ghost btn-sm" value="cancel" type="submit">✕</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   1) STEUER-KATALOG
   Register-Struktur exakt nach dem Steuerdossier-Aufbau
   (Kanton Zürich: Personalien · Ziff. 1–7 · 11–18 · 19–27 · 30–37 ·
    Hilfsformulare Berufsauslagen / Versicherungsprämien · Wertschriften).
   ================================================================== */
const REGISTERS = [
  { id:"R00", nr:"00", label:"Steuererklärung & Formulare",              hint:"Hauptformular, Wegleitung, Vollmacht, Zugangsdaten" },
  { id:"R01", nr:"01", label:"Personalien & Familienverhältnisse",       hint:"Seite 1 der Steuererklärung" },
  { id:"R02", nr:"02", label:"Einkünfte (Ziffern 1–7)",                  hint:"Lohn, Renten, Ersatzeinkünfte, Wertschriftenertrag" },
  { id:"R03", nr:"03", label:"Abzüge (Ziffern 11–18)",                   hint:"Berufsauslagen, Schuldzinsen, Säule 3a, Prämien" },
  { id:"R04", nr:"04", label:"Einkommensberechnung (Ziffern 19–27)",     hint:"Spenden, Sozialabzüge, Krankheitskosten" },
  { id:"R05", nr:"05", label:"Vermögen (Ziffern 30–37)",                 hint:"Konten, Krypto, Fahrzeuge, Schulden per 31.12." },
  { id:"R06", nr:"06", label:"Wertschriften- & Guthabenverzeichnis",     hint:"Seiten 9–10: Steuerwerte und Erträge" },
  { id:"R07", nr:"07", label:"Berufsauslagen (Hilfsformular)",           hint:"Seite 7: Fahrkosten, Verpflegung, Pauschale" },
  { id:"R08", nr:"08", label:"Versicherungsprämien (Hilfsformular)",     hint:"Seite 8: Kranken-, Unfall-, Lebensversicherung" },
  { id:"R09", nr:"09", label:"Liegenschaften",                           hint:"Eigenmietwert, Unterhalt, Hypotheken" },
  { id:"R10", nr:"10", label:"Aufstellungen & Bemerkungen",              hint:"Eigene Zusammenstellungen, Bemerkungsblatt" },
  { id:"R11", nr:"11", label:"Korrespondenz Steueramt",                  hint:"Fristerstreckung, Veranlagung, Schlussrechnung" },
  { id:"R99", nr:"99", label:"Unklar / manuell zuordnen",                hint:"Automatik war unsicher – bitte prüfen" }
];
const REG = Object.fromEntries(REGISTERS.map(r => [r.id, r]));

/* Dokumenttypen = Sortierregeln + Checklistenpunkte in einem.
   profil: Dokument wird nur verlangt, wenn eines dieser Merkmale gesetzt ist
           ("*" = immer). keys: Suchbegriffe für die Auto-Erkennung.         */
const DOCTYPES = [
  { id:"steuererklaerung", label:"Steuererklärung (Hauptformular)", reg:"R00", ziffer:"–",    profil:["*"],              keys:["steuererklärung","steuererklaerung","hauptformular","private tax"] },
  { id:"vollmacht",        label:"Vollmacht / Vertretung",          reg:"R00", ziffer:"–",    profil:["*"],              keys:["vollmacht","vertretung","mandat"] },
  { id:"zugangsdaten",     label:"Zugangsdaten ZHprivateTax",       reg:"R00", ziffer:"–",    profil:["*"],              keys:["zugangsdaten","zugangscode","etax","zh private tax","login steueramt"] },
  { id:"vorjahr",          label:"Steuererklärung Vorjahr",         reg:"R00", ziffer:"–",    profil:["*"],              keys:["vorjahr","letztes jahr"] },

  { id:"personalien",      label:"Personalienblatt / Ausweiskopie", reg:"R01", ziffer:"–",    profil:["*"],              keys:["personalienblatt","identitätskarte","identitaetskarte","id-karte","reisepass","niederlassungsbewilligung","aufenthaltsbewilligung"] },
  { id:"zivilstand",       label:"Nachweis Zivilstandsänderung",    reg:"R01", ziffer:"–",    profil:["zivilstand_neu"], keys:["heirat","eheschein","scheidung","trennung","partnerschaft"] },
  { id:"kinder",           label:"Kinder: Geburtsdaten & Ausbildungsnachweise", reg:"R01", ziffer:"–",    profil:["kinder"],         keys:["ausbildungsbestätigung","schulbestätigung","studienbestätigung","geburtsschein","familienausweis"] },

  { id:"lohnausweis",      label:"Lohnausweis (alle Arbeitgeber)",  reg:"R02", ziffer:"1.1",  profil:["unselbstaendig"], keys:["lohnausweis","salärausweis","certificat de salaire","jahreslohnausweis","bruttolohn","nettolohn"] },
  { id:"lohnausweis_neben",label:"Lohnausweis Nebenerwerb",         reg:"R02", ziffer:"1.2",  profil:["nebenerwerb"],    keys:["nebenerwerb","nebenjob","zweitarbeitgeber"] },
  { id:"lohnausweis_p",    label:"Lohnausweis Partner/in",          reg:"R02", ziffer:"1.1",  profil:["partner_erwerb"], keys:["lohnausweis partner","ehefrau lohn","ehemann lohn"] },
  { id:"selbst_abschluss", label:"Jahresrechnung selbständig",      reg:"R02", ziffer:"2.1",  profil:["selbstaendig"],   keys:["jahresrechnung","erfolgsrechnung","bilanz","abschluss","buchhaltung"] },
  { id:"ahv_rente",        label:"AHV-/IV-Rentenbescheinigung",     reg:"R02", ziffer:"3.1",  profil:["rente"],          keys:["ahv-rente","rentenbescheinigung","iv-rente","ausgleichskasse","rentenausweis"] },
  { id:"pk_rente",         label:"Pensionskassen-Rente (BVG)",      reg:"R02", ziffer:"3.2",  profil:["rente"],          keys:["pensionskasse rente","bvg-rente","vorsorgeeinrichtung rente"] },
  { id:"taggeld",          label:"Taggelder ALV / KTG / UVG",       reg:"R02", ziffer:"3.4",  profil:["arbeitslos","taggeld"], keys:["taggeld","arbeitslosenkasse","alv","krankentaggeld","unfalltaggeld","suva","mutterschaft",
             "mutterschaftsentschädigung","erwerbsersatz","eo-entschädigung"] },
  { id:"wertschriftenertrag",label:"Zinsausweis / Ertragsausweis",  reg:"R02", ziffer:"4.1",  profil:["wertschriften"],  keys:["zinsausweis","ertragsausweis","dividenden","couponausweis","steuerausweis wertschriften"] },
  { id:"unterhalt_erhalten",label:"Erhaltene Unterhaltsbeiträge",   reg:"R02", ziffer:"5.1",  profil:["alimente_erhaelt"], keys:["alimente erhalten","unterhaltsbeiträge erhalten"] },
  { id:"vr_honorar",       label:"Verwaltungsratshonorar",          reg:"R02", ziffer:"1.3",  profil:["nebenerwerb"],    keys:["verwaltungsrat","vr-honorar","sitzungsgeld","tantieme","verwaltungsratshonorar"] },
  { id:"uebrige_eink",     label:"Übrige Einkünfte",                reg:"R02", ziffer:"6",    profil:[],                 keys:["übrige einkünfte","nebeneinkünfte","erwerbsersatz","erwerbsausfall"] },

  { id:"fahrkosten",       label:"Fahrkosten (Abo / km-Nachweis)",  reg:"R07", ziffer:"11.1", profil:["fahrkosten"],     keys:["generalabonnement","halbtax","zvv","sbb","abo","fahrkosten","kilometer","arbeitsweg","parkkarte"] },
  { id:"verpflegung",      label:"Auswärtige Verpflegung",          reg:"R07", ziffer:"11.2", profil:["auswaertige_verpflegung"], keys:["verpflegung","kantine","lunch-check"] },
  { id:"weiterbildung",    label:"Aus-/Weiterbildungskosten",       reg:"R07", ziffer:"11.4", profil:["weiterbildung"],  keys:["weiterbildung","kursgeld","studiengebühr","seminar","ausbildungskosten"] },
  { id:"berufsauslagen",   label:"Berufsauslagen (Hilfsformular)",  reg:"R07", ziffer:"11",   profil:["unselbstaendig"], keys:["berufsauslagen","berufskosten"] },

  { id:"schuldzinsen",     label:"Schuldzinsen-Ausweis",            reg:"R03", ziffer:"12.1", profil:["schulden"],       keys:["schuldzinsen","kreditzins","darlehenszins","zinsbescheinigung"] },
  { id:"unterhalt_bezahlt",label:"Bezahlte Unterhaltsbeiträge",     reg:"R03", ziffer:"13.1", profil:["alimente_zahlt"], keys:["alimente bezahlt","unterhaltsbeiträge bezahlt","unterhaltszahlung"] },
  { id:"saeule3a",         label:"Bescheinigung Säule 3a",          reg:"R03", ziffer:"14.1", profil:["saeule3a"],       keys:["säule 3a","saeule 3a","säule3a","saeule-3a","säule-3a","3a","vorsorge 3a","freizügigkeit 3a"] },
  { id:"pk_einkauf",       label:"Einkauf Pensionskasse (2. Säule)",reg:"R03", ziffer:"14.2", profil:["saeule2einkauf"], keys:["einkauf pensionskasse","bvg einkauf","einkaufsbestätigung"] },

const DB_NAME = "steuer-crm", DB_VER = 3;
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("clients"))  d.createObjectStore("clients",  { keyPath:"id" });
      if(!d.objectStoreNames.contains("dossiers")) d.createObjectStore("dossiers", { keyPath:"id" });
      if(!d.objectStoreNames.contains("docs"))     d.createObjectStore("docs",     { keyPath:"id" });
      if(!d.objectStoreNames.contains("invoices")) d.createObjectStore("invoices", { keyPath:"id" });
      if(!d.objectStoreNames.contains("vergleiche")) d.createObjectStore("vergleiche", { keyPath:"id" });
      if(!d.objectStoreNames.contains("kv"))       d.createObjectStore("kv",       { keyPath:"k"  });
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => rej(rq.error);
  });
}
const tx = (store, mode="readonly") => db.transaction(store, mode).objectStore(store);
const rawAll = store => new Promise((res, rej) => { const r = tx(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const rawPut = (store, val) => new Promise((res, rej) => { const r = tx(store,"readwrite").put(val); r.onsuccess = () => res(val); r.onerror = () => rej(r.error); });
const rawDel = (store, key) => new Promise((res, rej) => { const r = tx(store,"readwrite").delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
const rawGet = (store, key) => new Promise((res, rej) => { const r = tx(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

/* ------------------------------------------------------------------
   VERSCHLÜSSELUNG (optional, standardmässig aktivierbar)
   Passwort -> PBKDF2 -> Schlüsselschlüssel (KEK) -> entpackt den
   eigentlichen Datenschlüssel (DEK, AES-GCM 256). Der DEK liegt
   zusätzlich mit einem Wiederherstellungsschlüssel verpackt vor,
   damit ein vergessenes Passwort nicht das Ende der Daten ist.
   ------------------------------------------------------------------ */
const SEC = { key:null, on:false, meta:null, idleMs:15*60*1000, timer:null, locked:false };
const PBKDF2_ITER = 310000;
const b64e = buf => { const u = new Uint8Array(buf); let s = ""; for(let i=0;i<u.length;i++) s += String.fromCharCode(u[i]); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
const randBytes = n => crypto.getRandomValues(new Uint8Array(n));

async function deriveKek(pass, saltB64, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64d(saltB64), iterations:iter || PBKDF2_ITER, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
const importDek = raw => crypto.subtle.importKey("raw", raw, { name:"AES-GCM" }, true, ["encrypt","decrypt"]);
async function wrapDek(dekRaw, kek){
  const iv = randBytes(12);
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, kek, dekRaw);
  return { iv:b64e(iv), ct:b64e(ct) };
}
async function unwrapDek(wrapped, kek){
  const raw = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64d(wrapped.iv) }, kek, b64d(wrapped.ct));
  return new Uint8Array(raw);
}
async function encJson(obj){
  const iv = randBytes(12);
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, SEC.key,
              new TextEncoder().encode(JSON.stringify(obj)));
  return { iv, ct };
}
async function decJson(iv, ct){
  const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, SEC.key, ct);
  return JSON.parse(new TextDecoder().decode(buf));
}
async function encBytes(buf){
  const iv = randBytes(12);
  return { iv, ct: await crypto.subtle.encrypt({ name:"AES-GCM", iv }, SEC.key, buf) };
}
const decBytes = (iv, ct) => crypto.subtle.decrypt({ name:"AES-GCM", iv }, SEC.key, ct);

/* Wiederherstellungsschlüssel: 20 Byte, lesbar in 5er-Gruppen. */
const RECOVERY_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newRecoveryKey(){
  const b = randBytes(20); let out = "";
  for(let i = 0; i < b.length; i++){ out += RECOVERY_ALPHABET[b[i] % 32]; if(i % 5 === 4 && i < b.length-1) out += "-"; }
  return out;
}
const normRecovery = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

/* ---------- Speicher-Wrapper: verschlüsseln/entschlüsseln transparent ---------- */
async function dbPut(store, val){
  if(store === "kv") return rawPut(store, val);
  const prev = await rawGet(store, val.id).catch(() => null);
  if(!SEC.key){
    const rec = { ...val };
    if(!rec.blob && prev && prev.blob) rec.blob = prev.blob;   // Datei nicht verlieren
    delete rec.e; delete rec.iv; delete rec.ct; delete rec.fiv; delete rec.fct; delete rec.ftype;
    rec.rev = Date.now();
    await rawPut(store, rec);
    return val;
  }
  const { blob, ...meta } = val;
  const { iv, ct } = await encJson(meta);
  const rec = { id:val.id, e:1, iv, ct, rev:Date.now() };
  if(blob){
    const f = await encBytes(await blob.arrayBuffer());
    rec.fiv = f.iv; rec.fct = f.ct; rec.ftype = blob.type || "application/octet-stream";
  } else if(prev && prev.fct){                                  // bestehende Datei übernehmen
    rec.fiv = prev.fiv; rec.fct = prev.fct; rec.ftype = prev.ftype;
  } else if(prev && prev.blob){                                 // vorher unverschlüsselt abgelegt
    const f = await encBytes(await prev.blob.arrayBuffer());
    rec.fiv = f.iv; rec.fct = f.ct; rec.ftype = prev.blob.type || "application/octet-stream";
  }
  await rawPut(store, rec);
  return val;
}
async function unpack(rec, withFile){
  if(!rec) return rec;
  if(!rec.e){ const { blob, ...meta } = rec; return withFile && blob ? { ...meta, blob } : meta; }
  if(!SEC.key) throw new Error("locked");
  const meta = await decJson(rec.iv, rec.ct);
  if(withFile && rec.fct) meta.blob = new Blob([await decBytes(rec.fiv, rec.fct)], { type:rec.ftype || "application/octet-stream" });
  return meta;
}
async function dbAll(store){
  const raw = await rawAll(store);
  const out = [];
  for(const r of raw) if(!r.del) out.push(await unpack(r, false));   // Dateien bleiben auf der Platte
  return out;
}
const dbGet = async (store, key, withFile=true) => {
  const r = await rawGet(store, key);
  return (!r || r.del) ? undefined : unpack(r, withFile);
};
/* Löschen hinterlässt einen Grabstein, damit die Löschung auch auf
   andere Geräte synchronisiert wird (statt dort wieder aufzutauchen). */
const dbDel = (store, key) => rawPut(store, { id:key, del:1, rev:Date.now() });

/* Alle Datensätze neu schreiben – beim Ein-/Ausschalten der Verschlüsselung
   und beim Passwortwechsel (der Datenschlüssel selbst bleibt gleich).       */
async function rewriteAll(newKey){
  const oldKey = SEC.key;
  for(const store of ["clients","dossiers","docs","invoices","vergleiche"]){
    for(const r of await rawAll(store)){
      if(r.del) continue;
      SEC.key = oldKey; const full = await unpack(r, true);
      SEC.key = newKey; await dbPut(store, full);
    }
  }
  SEC.key = newKey; SEC.on = !!newKey;
}

/* ---------- Sperren, Entsperren, Passwort verwalten ---------- */
const loadSecMeta = async () => (await rawGet("kv","crypto"))?.v || null;
const saveSecMeta = meta => rawPut("kv", { k:"crypto", v:meta });

async function encryptionEnable(pass){
  const dekRaw = randBytes(32);
  const salt = b64e(randBytes(16)), recSalt = b64e(randBytes(16));
  const kek = await deriveKek(pass, salt, PBKDF2_ITER);
  const recKey = newRecoveryKey();
  const rkek = await deriveKek(normRecovery(recKey), recSalt, PBKDF2_ITER);
  const meta = { v:1, iter:PBKDF2_ITER, salt, recSalt,
                 wrap: await wrapDek(dekRaw, kek), rwrap: await wrapDek(dekRaw, rkek), since:today() };
  await rewriteAll(await importDek(dekRaw));
  SEC.meta = meta; await saveSecMeta(meta);
  return recKey;
}
async function encryptionDisable(pass){
  if(!await unlockWithPassword(pass, true)) return false;
  await rewriteAll(null);
  SEC.meta = null; await rawDel("kv","crypto");
  return true;
}
async function unlockWithPassword(pass, keepState){
  const meta = SEC.meta || await loadSecMeta(); if(!meta) return false;
  try{
    const kek = await deriveKek(pass, meta.salt, meta.iter);
    const dekRaw = await unwrapDek(meta.wrap, kek);
    SEC.key = await importDek(dekRaw); SEC.on = true; SEC.meta = meta; SEC.locked = false;
    return true;
  }catch(e){ if(!keepState){ SEC.key = null; } return false; }
}
async function unlockWithRecovery(recKey, newPass){
  const meta = SEC.meta || await loadSecMeta(); if(!meta) return false;
  try{
    const rkek = await deriveKek(normRecovery(recKey), meta.recSalt, meta.iter);
    const dekRaw = await unwrapDek(meta.rwrap, rkek);
    SEC.key = await importDek(dekRaw); SEC.on = true; SEC.locked = false;
    const salt = b64e(randBytes(16));
    meta.salt = salt; meta.wrap = await wrapDek(dekRaw, await deriveKek(newPass, salt, meta.iter));
    SEC.meta = meta; await saveSecMeta(meta);
    return true;
  }catch(e){ SEC.key = null; return false; }
}
async function changePassword(oldPass, newPass){
  const meta = SEC.meta || await loadSecMeta(); if(!meta) return false;
  try{
    const kek = await deriveKek(oldPass, meta.salt, meta.iter);
    const dekRaw = await unwrapDek(meta.wrap, kek);
    const salt = b64e(randBytes(16));
    meta.salt = salt; meta.wrap = await wrapDek(dekRaw, await deriveKek(newPass, salt, meta.iter));
    SEC.meta = meta; await saveSecMeta(meta);
    return true;
  }catch(e){ return false; }
}
async function newRecoveryFor(pass){
  const meta = SEC.meta || await loadSecMeta(); if(!meta) return null;
  try{
    const dekRaw = await unwrapDek(meta.wrap, await deriveKek(pass, meta.salt, meta.iter));
    const recKey = newRecoveryKey(), recSalt = b64e(randBytes(16));
    meta.recSalt = recSalt;
    meta.rwrap = await wrapDek(dekRaw, await deriveKek(normRecovery(recKey), recSalt, meta.iter));
    SEC.meta = meta; await saveSecMeta(meta);
    return recKey;
  }catch(e){ return null; }
}
function lockNow(){

let DL = { api:null, tried:false };
async function downloadApi(){

  DL.tried = true;

  catch(e){ DL.api = null; }

function downloadFallback(blob, filename){
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function download(blob, filename){
  const api = await downloadApi();
  if(api){
    try{ await api.save({ filename, data:blob }); return true; }
    catch(e){
      if(e?.code === "declined") return false;                  // Nutzer hat abgelehnt
      if(["rate_limited","too_large"].includes(e?.code)){ toast("Speichern nicht möglich: " + e.message); return false; }
      /* alles Übrige (Format nicht freigegeben, Fähigkeit weg): normaler Weg */
    }
  }
  downloadFallback(blob, filename);
  return true;
}

const JAHR_OK = y => y >= 2015 && y <= new Date().getFullYear();
/* Isolierte Jahreszahlen – "20250115" aus einem Scanner-Dateinamen ist ein
   Datum, kein Steuerjahr, und zählt deshalb nicht mit.                    */
function jahresZahlen(t){
  return (String(t).match(/\d+/g) || []).filter(n => n.length === 4)
    .map(Number).filter(JAHR_OK);
}
/* Ausdrückliche Periodenangabe auf dem Beleg – sie schlägt jedes Datum,
   denn ausgestellt wird fast immer erst im Folgejahr.                     */
function starkesJahr(t){
  const stark = [
    /(?:steuerperiode|steuerjahr|bemessungsjahr|beitragsjahr|periode)\D{0,12}(20\d{2})/,
    /01\.01\.\s?[-\u2013bis ]{1,6}\s?31\.12\.\s?(20\d{2})/,
    /31\.?\s?12\.?\s?(20\d{2})/,
    /(?:lohnausweis|jahresrechnung|praemienbescheinigung|zinsausweis|steuerauszug)\D{0,12}(20\d{2})/,
    /(20\d{2})\s*(?:lohnausweis|jahresrechnung|praemienbescheinigung)/
  ];
  for(const re of stark){ const m = String(t).match(re); if(m && JAHR_OK(+m[1])) return m[1]; }
  return null;
}
/* Steuerjahr bestimmen: Belegtext vor Dateiname, Periodenangabe vor Datum. */
function detectYear(text, filename = ""){
  const t = normText(text), f = normText(filename);
  const häufigste = list => {
    if(!list.length) return null;
    const cnt = {}; list.forEach(y => cnt[y] = (cnt[y]||0)+1);
    return String(Object.entries(cnt).sort((a,b) => b[1]-a[1] || a[0]-b[0])[0][0]);
  };
  return starkesJahr(t) || starkesJahr(f) || häufigste(jahresZahlen(t)) || häufigste(jahresZahlen(f));
}
/* Umlaute und OCR-Verwechslungen entschärfen: "Prämien" == "Praemien",
   damit auch ein Scan mit ae/oe/ue oder falsch gelesenem Umlaut trifft.  */
function normText(t){
  return String(t).toLowerCase()
    .replace(/\u00e4/g,"ae").replace(/\u00f6/g,"oe").replace(/\u00fc/g,"ue").replace(/\u00df/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ");
}
/* Treffersuche: kurze Stichwörter nur als ganzes Wort, damit z.B. "abo"
   nicht mitten in einem anderen Wort anschlägt.                          */
function keyHit(hay, k){
  if(k.length >= 6) return hay.includes(k);
  const esc0 = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z0-9\u00e4\u00f6\u00fc])" + esc0 + "([^a-z0-9\u00e4\u00f6\u00fc]|$)").test(hay);
}
/* Score: Treffer im Dateinamen wiegen 3×, Treffer im PDF-Text 1×.
   Lange Stichwörter schlagen kurze ("lohnausweis" gewinnt gegen "ausweis"). */
function classify(filename, text){
  const fn = normText(filename), tx = normText(text || "").slice(0, 20000);
  let best = { id:"sonstiges", score:0, hits:[] }, second = 0;
  for(const d of DOCTYPES){
    let score = 0; const hits = [];
    for(const raw of d.keys){
      const k = normText(raw.trim());
      if(keyHit(fn, k)){ score += 3 * k.length; hits.push(k); }
      else if(tx && keyHit(tx, k)){ score += k.length; hits.push(k); }
    }
    if(score > best.score){ second = best.score; best = { id:d.id, score, hits }; }
    else if(score > second) second = score;
  }
  // "sicher" = deutlicher Treffer oder klarer Abstand zum zweitbesten Typ
  const sicher = best.score >= 18 || (best.score >= 6 && best.score >= 2 * second);
  return { docType:best.id, score:best.score, sicher, hits:best.hits.slice(0,4) };
}

/* ------------------------------------------------------------------
   PDF-Text ohne externe Bibliothek lesen.
   Zieht die Textstellen direkt aus den (meist Flate-komprimierten)
   Inhaltsströmen. Damit funktioniert die Inhaltserkennung auch offline
   und bei lokal geöffneten Dateien. Für Sonderfälle (exotische
   Schrifteinbettung) bleibt pdf.js als Reserve.
   ------------------------------------------------------------------ */
const latin1 = u8 => { let s = "", n = 32768;
  for(let i = 0; i < u8.length; i += n) s += String.fromCharCode.apply(null, u8.subarray(i, i+n));
  return s; };
async function inflate(bytes){
  if(typeof DecompressionStream === "undefined") return null;
  for(const fmt of ["deflate","deflate-raw"]){
    try{
      const buf = await new Response(new Blob([bytes]).stream()
        .pipeThrough(new DecompressionStream(fmt))).arrayBuffer();
      const out = new Uint8Array(buf);
      if(out.length) return out;
    }catch(e){ /* nächstes Format versuchen */ }
  }
  return null;
}
/* Textstücke aus einem Inhaltsstrom: (…) Tj / [(…)…] TJ / <hex> Tj */
function streamText(str){
  const out = [];
  const re = /\((?:\\.|[^()\\])*\)|<[0-9A-Fa-f\s]+>/g;
  let m;
  while((m = re.exec(str))){
    const raw = m[0];
    if(raw[0] === "<"){
      const hex = raw.slice(1,-1).replace(/\s+/g,"");
      let t = "";
      for(let i = 0; i + 1 < hex.length; i += 2){
        const code = parseInt(hex.substr(i,2), 16);
        if(code >= 32 || code === 10) t += String.fromCharCode(code);
      }
      out.push(t);
    } else {
      out.push(raw.slice(1,-1)
        .replace(/\\([nrtbf])/g, " ")
        .replace(/\\([0-7]{1,3})/g, (_,o) => String.fromCharCode(parseInt(o,8)))
        .replace(/\\(.)/g, "$1"));
    }
  }
  return out.join(" ");
}
async function pdfTextLocal(file, maxBytes = 12e6){
  try{
    const bytes = new Uint8Array(await file.slice(0, maxBytes).arrayBuffer());
    if(latin1(bytes.subarray(0,5)) !== "%PDF-") return "";
    const doc = latin1(bytes);
    let out = "", i = 0, streams = 0;
    while((i = doc.indexOf("stream", i)) !== -1 && streams < 60){
      const dictStart = doc.lastIndexOf("<<", i);
      const dict = dictStart === -1 ? "" : doc.slice(dictStart, i);
      let s = i + 6;
      if(doc[s] === "\r") s++;
      if(doc[s] === "\n") s++;
      const end = doc.indexOf("endstream", s);
      if(end === -1) break;
      i = end + 9;
      if(/\/(Image|DCTDecode|JPXDecode|JBIG2Decode|CCITTFaxDecode)/.test(dict)) continue;
      /* Ende exakt bestimmen: /Length wenn vorhanden, sonst Zeilenumbrüche
         vor "endstream" abschneiden – sonst scheitert die Dekomprimierung. */
      const lenM = dict.match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/);
      let stop = end;
      if(lenM && s + (+lenM[1]) <= end) stop = s + (+lenM[1]);
      else while(stop > s && (bytes[stop-1] === 10 || bytes[stop-1] === 13)) stop--;
      let data = bytes.subarray(s, stop);
      if(/FlateDecode/.test(dict)) data = await inflate(data);
      if(!data) continue;
      streams++;
      out += streamText(latin1(data)) + "\n";
      if(out.length > 40000) break;
    }
    return out;
  }catch(e){ return ""; }
}
const textUsable = t => (String(t).match(/[A-Za-zÄÖÜäöü]{3,}/g) || []).length >= 5;

/* Reserve: pdf.js (nur mit Internetverbindung, z.B. für PDFs mit
   ungewöhnlicher Schrifteinbettung).                                     */
let pdfjsReady = null;
function loadPdfJs(){
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise(res => {
    if(window.pdfjsLib) return res(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
      res(window.pdfjsLib || null);
    };
    s.onerror = () => res(null);
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
async function pdfText(file, maxPages=3){
  if(!/\.pdf$/i.test(file.name)) return "";
  const local = await pdfTextLocal(file);          // erst ohne Netz versuchen
  if(textUsable(local)) return local;
  const lib = await loadPdfJs(); if(!lib) return local;
  try{
    const buf = await file.arrayBuffer();
    const pdf = await lib.getDocument({ data:buf }).promise;
    let out = "";
    for(let i = 1; i <= Math.min(maxPages, pdf.numPages); i++){
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      out += c.items.map(it => it.str).join(" ") + "\n";
    }
    return textUsable(out) ? out : local;
  }catch(e){ return local; }
}

/* ------------------------------------------------------------------
   OCR für Scans und Fotos ohne Textebene (optional).
   Braucht Internet: tesseract.js wird beim ersten Mal geladen
   (rund 15 MB inkl. Sprachdaten, danach im Browser-Cache).
   ------------------------------------------------------------------ */
const OCR_LOCAL = "vendor/tesseract/";      // mitgeliefert – kein fremder Server nötig
const TESSERACT_URL = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js";
const OCR = { paths:null, failed:false, failedMsg:"" };
const isBild = name => /\.(png|jpe?g|webp|bmp|gif|tiff?)$/i.test(name);
async function loadTesseract(){
  if(window.Tesseract && OCR.paths) return window.Tesseract;
  /* Einmal gescheitert heisst gescheitert – sonst hängt jede weitere Datei
     erneut im Ladeversuch fest. */
  if(OCR.failed) throw new Error(OCR.failedMsg);
  let lokal = false;
  try{ lokal = (await fetch(OCR_LOCAL + "tesseract.min.js", { method:"HEAD" })).ok; }catch(e){ lokal = false; }
  try{
    if(!window.Tesseract) await loadScript(lokal ? OCR_LOCAL + "tesseract.min.js" : TESSERACT_URL);
  }catch(e){ /* Meldung unten */ }
  if(!window.Tesseract){
    OCR.failed = true;
    OCR.failedMsg = location.protocol === "file:"
      ? "Scan-Erkennung geht in der lokal geöffneten Datei nicht (Sicherheitsregel des Browsers). "
        + "Dafür die gehostete Version unter https:// verwenden – dort ist die Erkennung mitgeliefert."
      : "Texterkennung konnte nicht geladen werden – Ordner vendor/tesseract/ fehlt und es ist keine Internetverbindung da.";
    throw new Error(OCR.failedMsg);
  }
  OCR.paths = lokal ? { workerPath: OCR_LOCAL + "worker.min.js",
                        corePath:   OCR_LOCAL + "core",
                        langPath:   OCR_LOCAL + "lang" } : {};
  return window.Tesseract;
}
/* Erste Seite eines PDF in ein Bild rendern (dafür wird pdf.js gebraucht). */
async function pdfPageToCanvas(file, scale = 2){
  const lib = await loadPdfJs();
  if(!lib) throw new Error("PDF-Renderer nicht verfügbar – für OCR von PDFs ist eine Internetverbindung nötig.");
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await pdf.getPage(1);
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  return canvas;
}
async function ocrFile(file, onProgress = () => {}){
  const T = await loadTesseract();
  const src = isBild(file.name) ? file : await pdfPageToCanvas(file);
  const res = await T.recognize(src, S.settings.ocrLang || "deu", {
    ...(OCR.paths || {}),
    logger: m => { if(m.status === "recognizing text") onProgress(Math.round((m.progress || 0) * 100)); }
  });
  return res?.data?.text || "";
}

/* ---------- ZIP (Store-Verfahren, ohne Bibliothek) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n;
    for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; }
  return t;
})();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipDate(d){ return { t:((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()/2))&0xFFFF,
                              d:(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF }; }
async function makeZip(files){   // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder(), chunks = [], central = [];
  let offset = 0; const { t, d } = zipDate(new Date());
  for(const f of files){
    const name = enc.encode(f.name), crc = crc32(f.data), len = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, t, true); lh.setUint16(12, d, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, len, true); lh.setUint32(22, len, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, t, true); ch.setUint16(14, d, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, len, true); ch.setUint32(24, len, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + len;
  }
  const cdStart = offset;
  let cdSize = 0; central.forEach(c => cdSize += c.length);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, cdStart, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type:"application/zip" });
}

/* ------------------------------------------------------------------
   PDF SCHREIBEN – echte PDF-Datei ohne fremde Bibliothek.
   Erzeugt A4-Seiten mit Helvetica (in jedem Reader vorhanden, daher
   keine Schrifteinbettung nötig), Tabellen, Seitenumbruch und
   Seitenzahlen. Damit lässt sich ein Bericht direkt speichern,
   statt den Umweg über den Druckdialog zu nehmen.
   ------------------------------------------------------------------ */
/* Zeichenbreiten Helvetica (1/1000 pt) – genug für Umbruch und
   rechtsbündige Zahlen (Ziffern sind alle 556 breit).               */
const HELV_W = (() => {
  const w = {}; const set = (chars, val) => [...chars].forEach(c => w[c] = val);
  set(" !", 278); set("\"", 355); set("#$", 556); set("%", 889); set("&", 667);
  set("'", 191); set("()", 333); set("*", 389); set("+", 584); set(",.", 278);
  set("/", 278); set("0123456789", 556); set(":;", 278); set("<=>", 584); set("?", 556);
  set("@", 1015); set("ABDEHKNPRSUVXY", 667); set("C", 722); set("G", 778); set("F", 611);
  set("I", 278); set("J", 500); set("LZ", 611); set("M", 833); set("O", 778); set("Q", 778);
  set("T", 611); set("W", 944); set("[]", 278); set("\\", 278); set("^", 469); set("_", 556);
  set("`", 333); set("abcdeghnopqsuvy", 556); set("f", 278); set("ij", 222); set("k", 500);
  set("l", 222); set("m", 833); set("rt", 333); set("wxz", 500); set("{}", 334); set("|", 260);
  set("äöüÄÖÜéèàçÉÈÀ", 556); set("ß", 611);
  return w;
})();
const pdfW = (s, size) => [...String(s)].reduce((a,c) => a + (HELV_W[c] ?? 556), 0) * size / 1000;
/* Sonderzeichen auf Latin-1 abbilden – sonst zeigt der Reader Kästchen. */
const pdfTxt = s => String(s ?? "")
  .replace(/[–—]/g, "-").replace(/[‘’′]/g, "'")
  .replace(/[“”]/g, '"').replace(/…/g, "...").replace(/ /g, " ")
  .replace(/✓/g, "x").replace(/⚠️?/g, "!").replace(/→/g, "->")
  .replace(/[•·]/g, "·")
  .replace(/[^\x20-\x7E -ÿ]/g, "");
const pdfEsc = s => pdfTxt(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");

function pdfDoc({ margin = 42, size = 9.5 } = {}){
  const W = 595.28, H = 841.89;
  const pages = [];                      // je Seite: Liste von Content-Fragmenten
  let cur = null, y = 0;
  const d = {
    W, H, margin, size,
    get y(){ return y; }, set y(v){ y = v; },
    breite: W - 2 * margin,
    neueSeite(kopf){
      cur = []; pages.push(cur); y = H - margin;
      if(kopf) kopf(d);
      return d;
    },
    /* Text setzen. al: "left" | "right" | "center", bezogen auf x bzw. x+w */
    text(str, x, opt = {}){
      const s = opt.size || size, font = opt.b ? "F2" : "F1";
      let tx = x;
      const breite = pdfW(pdfTxt(str), s);
      if(opt.al === "right")  tx = x + (opt.w || 0) - breite;
      if(opt.al === "center") tx = x + ((opt.w || 0) - breite) / 2;
      const c = opt.c || [0.08, 0.11, 0.15];
      cur.push(`BT /${font} ${s} Tf ${c[0]} ${c[1]} ${c[2]} rg ${tx.toFixed(2)} ${(opt.y ?? y).toFixed(2)} Td (${pdfEsc(str)}) Tj ET`);
      return breite;
    },
    /* Text im Kasten umbrechen, gibt die benötigte Höhe zurück. */
    textBox(str, x, w, opt = {}){
      const s = opt.size || size, zeilen = [];
      let zeile = "";
      for(const wort of pdfTxt(str).split(/\s+/)){
        const test = zeile ? zeile + " " + wort : wort;
        if(pdfW(test, s) > w && zeile){ zeilen.push(zeile); zeile = wort; } else zeile = test;
      }
      if(zeile) zeilen.push(zeile);
      zeilen.forEach((z,i) => d.text(z, x, { ...opt, y:(opt.y ?? y) - i * s * 1.25 }));
      return zeilen.length * s * 1.25;
    },
    linie(x1, y1, x2, y2, grau = 0.78){
      cur.push(`${grau} G 0.5 w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    },
    flaeche(x, yy, w, h, rgb = [0.92, 0.95, 0.99]){
      cur.push(`${rgb[0]} ${rgb[1]} ${rgb[2]} rg ${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
    },
    async blob(){
      const enc = new TextEncoder();
      const objs = [];
      const add = str => { objs.push(str); return objs.length; };          // 1-basierte Objektnummer
      const seitenIds = [];
      const kids = [];
      const inhalt = pages.map(pg => pg.join("\n"));
      /* Objekte: 1 Catalog, 2 Pages, 3 Font F1, 4 Font F2, danach je Seite Content + Page */
      add("<< /Type /Catalog /Pages 2 0 R >>");
      add("");                                                            // Platzhalter Pages
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      inhalt.forEach(txt => {
        const cId = add(`<< /Length ${enc.encode(txt).length} >>\nstream\n${txt}\nendstream`);
        const pId = add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] `
          + `/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cId} 0 R >>`);
        seitenIds.push(pId); kids.push(`${pId} 0 R`);
      });
      objs[1] = `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${seitenIds.length} >>`;
      let out = "%PDF-1.4\n", offsets = [];
      objs.forEach((o, i) => { offsets.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`
           + offsets.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("")
           + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      const bytes = new Uint8Array(out.length);
      for(let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return new Blob([bytes], { type:"application/pdf" });
    },
    /* Seitenzahlen erst am Schluss setzen – vorher ist die Gesamtzahl offen. */
    seitenzahlen(){
      const n = pages.length;
      pages.forEach((pg, i) => {
        const txt = `Seite ${i + 1} von ${n}`, s = 8;
        pg.push(`BT /F1 ${s} Tf 0.55 0.60 0.67 rg `
              + `${(W - margin - pdfW(txt, s)).toFixed(2)} ${(margin - 14).toFixed(2)} Td (${pdfEsc(txt)}) Tj ET`);
      });
    },
    seiten(){ return pages.length; }
  };
  return d;
}
/* Tabelle setzen – bricht selbständig auf die nächste Seite um.
   spalten: [{ titel, w, al }] · zeilen: [{ cells:[…], b, fill }]        */
function pdfTabelle(d, spalten, zeilen, kopf){
  const zh = d.size * 1.9;
  const kopfZeile = () => {
    d.flaeche(d.margin, d.y - zh + 6, d.breite, zh);
    let x = d.margin;
    spalten.forEach(sp => { d.text(sp.titel, x + 4, { b:true, w:sp.w - 8, al:sp.al, size:d.size - 0.5 }); x += sp.w; });
    d.y -= zh;
  };
  kopfZeile();
  zeilen.forEach(z => {
    if(d.y < d.margin + 60){ d.neueSeite(kopf); kopfZeile(); }
    if(z.fill) d.flaeche(d.margin, d.y - zh + 6, d.breite, zh, z.fill);
    let x = d.margin;
    z.cells.forEach((c, i) => {
      const sp = spalten[i];
      d.text(c, x + 4, { b:z.b, w:sp.w - 8, al:sp.al });
      x += sp.w;
    });
    d.linie(d.margin, d.y - 5, d.margin + d.breite, d.y - 5);
    d.y -= zh;
  });
  d.y -= 6;
}

/* Zahlen tolerant lesen: "12'500.50", "12 500", "12,5" */
function vglNum(x){
  if(typeof x === "number") return isFinite(x) ? x : 0;
  const n = parseFloat(String(x ?? "").replace(/['\s’]/g,"").replace(",","."));
  return isFinite(n) ? n : 0;
}
const abrunden100 = n => Math.max(0, Math.floor(n / 100) * 100);

/* Steuerbetrag aus einem Stufentarif. */
function tarifSteuer(t, einkommen){
  if(!t) return 0;
  const e = Math.max(0, einkommen);
  if(t.flatAb && e >= t.flatAb) return e * t.flatSatz;
  let st = t.stufen[0];
  for(const s of t.stufen) if(e >= s.ab) st = s;
  return Math.max(0, st.sockel + (e - st.ab) * st.satz);
}
/* Einfache Vermögenssteuer: Freibetrag abziehen, danach Tranchen. */
function vermoegensSteuerEinfach(vt, vermoegen, verheiratet, kinder){
  if(!vt) return 0;
  const frei = (verheiratet ? vt.freibetrag.verheiratet : vt.freibetrag.alleinstehend)
             + (kinder || 0) * (vt.freibetragProKind || 0);
  let rest = Math.max(0, Math.floor((vermoegen - frei) / 1000) * 1000), steuer = 0;
  for(const s of vt.stufen){
    if(rest <= 0) break;
    const teil = Math.min(rest, s.tranche === Infinity ? rest : s.tranche);
    steuer += teil * s.satz; rest -= teil;
  }
  return steuer;
}

/* ------------------------------------------------------------------
   Kernberechnung eines Jahres.
   daten  = erfasste Positionen, stat = Status/Annahmen des Vergleichs,
   extra  = zusätzliche Abzüge eines Szenarios (3a, PK-Einkauf, weitere).
   ------------------------------------------------------------------ */
function vglRechnung(daten, stat, extra){
  const x = extra || {};
  const zus3a = Math.max(0, vglNum(x.s3a)), zusPk = Math.max(0, vglNum(x.pk));
  const zusW = vglNum(x.weitere);          // darf negativ sein: so wird der Grenzsatz gemessen
  const v = k => Math.max(0, vglNum((daten || {})[k]));
  const summe = keys => keys.reduce((a,k) => a + v(k), 0);

  const einkuenfte = summe(VGL_KEYS("eink"));
  const abzuegeBasis = summe(VGL_KEYS("abz"));
  const abzuege = abzuegeBasis + zus3a + zusPk + zusW;
  const netto = einkuenfte - abzuege;
  const weitere = summe(VGL_KEYS("weit"));

  const verheiratet = !!stat.verheiratet, kinder = Math.max(0, Math.round(vglNum(stat.kinder)));
  const sozKanton = kinder * vglNum(stat.kinderabzugKanton) + (verheiratet ? vglNum(stat.verheiratetenabzugKanton) : 0);
  const sozBund   = kinder * vglNum(stat.kinderabzugBund)   + (verheiratet ? vglNum(stat.verheiratetenabzugBund)   : 0);

  const stbKanton = abrunden100(netto - weitere - sozKanton);
  const stbBund   = abrunden100(netto - weitere - sozBund);
  const reinvermoegen = Math.max(0, v("v_aktiven") - v("v_schulden"));

  const r = { einkuenfte, abzuegeBasis, abzuege, zus3a, zusPk, zusW, netto, weitere,
              sozKanton, sozBund, stbKanton, stbBund, reinvermoegen,
              modus: stat.modus === "grenzsatz" ? "grenzsatz" : "tarif" };

  if(r.modus === "grenzsatz"){
    /* Schnellmodus: keine absolute Steuerlast, nur Wirkung über den Grenzsatz. */
    r.grenzsatz = Math.max(0, vglNum(stat.grenzsatz)) / 100;
    r.bund = r.kanton = r.gemeinde = r.kirche = r.vermoegenssteuer = null;
    r.total = null;
    r.stbVermoegen = reinvermoegen;
    return r;
  }

  const kt = KT_TARIF(stat.kanton);
  const tarifKey = verheiratet ? "verheiratet" : "alleinstehend";
  r.bund = Math.max(0, tarifSteuer(TARIFE.bund[tarifKey], stbBund)
                       - kinder * TARIFE.bund.kinderabzugSteuerbetrag);
  r.bund = Math.round(r.bund * 20) / 20;                    // auf 5 Rappen

  if(!kt){                                                   // kein Tarif hinterlegt
    r.kanton = r.gemeinde = r.kirche = r.vermoegenssteuer = null;
    r.total = r.bund; r.ohneKantonstarif = true;
    r.grenzsatz = 0; r.stbVermoegen = reinvermoegen;
    return r;
  }
  const einfEink = tarifSteuer(kt.einkommen[tarifKey], stbKanton);
  const einfVerm = vermoegensSteuerEinfach(kt.vermoegen, reinvermoegen, verheiratet, kinder);
  const f = n => Math.max(0, vglNum(n)) / 100;
  r.einfacheSteuerEink = einfEink;
  r.einfacheSteuerVerm = einfVerm;
  r.kanton   = (einfEink + einfVerm) * f(stat.fussKanton);
  r.gemeinde = (einfEink + einfVerm) * f(stat.fussGemeinde);
  r.kirche   = (einfEink + einfVerm) * f(stat.fussKirche);
  r.vermoegenssteuer = einfVerm * (f(stat.fussKanton) + f(stat.fussGemeinde) + f(stat.fussKirche));
  r.stbVermoegen = reinvermoegen;
  r.total = r.bund + r.kanton + r.gemeinde + r.kirche;

  /* Grenzsteuersatz numerisch: was kostet der nächste Tausender Einkommen?
     Der Probelauf läuft ohne eigene Grenzsatzmessung – sonst käme es zur Endlosschleife. */
  if(x.ohneGrenzsatz){ r.grenzsatz = 0; }
  else {
    const probe = vglRechnung(daten, stat, { s3a:zus3a, pk:zusPk, weitere:zusW - 1000, ohneGrenzsatz:true });
    r.grenzsatz = Math.max(0, (probe.total - r.total) / 1000);
  }
  r.durchschnitt = stbKanton > 0 ? r.total / stbKanton : 0;
  return r;
}

/* Wirkung eines zusätzlichen Abzugs (Szenario). */
function vglSzenario(daten, stat, basis, sz){
  const einsatz = Math.max(0, vglNum(sz.s3a)) + Math.max(0, vglNum(sz.pk)) + Math.max(0, vglNum(sz.weitere));
  const r = vglRechnung(daten, stat, sz);
  let ersparnis;
  if(basis.modus === "grenzsatz"){
    ersparnis = einsatz * (basis.grenzsatz || 0);
    r.total = null;
  } else {
    ersparnis = basis.total - r.total;
  }
  return { ...sz, einsatz, rechnung:r, ersparnis,
           quote: einsatz > 0 ? ersparnis / einsatz : 0,
           stbNeu: r.stbKanton };
}

/* Einkauf gestaffelt statt einmalig – bricht die Progression. */
function vglStaffelung(daten, stat, basis, betrag, jahre){
  const b = Math.max(0, vglNum(betrag)), n = Math.max(1, Math.round(vglNum(jahre) || 1));
  if(b <= 0) return null;
  const einmal = vglSzenario(daten, stat, basis, { pk:b });
  const proJahr = vglSzenario(daten, stat, basis, { pk:b / n });
  const gestaffelt = proJahr.ersparnis * n;
  return { betrag:b, jahre:n, proJahr:b / n, einmalig:einmal.ersparnis, gestaffelt,
           vorteil: gestaffelt - einmal.ersparnis,
           quoteEinmal: einmal.quote, quoteGestaffelt: proJahr.quote };
}

const vergleichOf = (clientId, jahrNeu) =>

  const kt = KT_TARIF(c?.kanton) || TARIFE.kantone.ZH;
  const gem = (kt.gemeinden || {})[c?.gemeinde] || Object.values(kt.gemeinden || {})[0] || { gemeinde:115, kirche:{ "keine":0 } };
  const verh = ["verheiratet","eingetragene Partnerschaft"].includes(c?.zivilstand);

           fussKanton:kt.steuerfussKanton ?? 98, fussGemeinde:gem.gemeinde, fussKirche:0,

async function ensureVergleich(clientId, jahrNeu){

          { label:"Säule 3a (Maximum mit PK)", s3a:TARIFE.vorgaben.saeule3aMitPk, pk:"", weitere:"" },
          { label:"Einkauf Pensionskasse",     s3a:"", pk:10000, weitere:"" }
        ],

/* ---------- Berichtsmodell: eine Quelle für Bildschirm, Druck und Word ---------- */
function vglBericht(v){
  const c = clientById(v.clientId) || {};
  const st = v.stat, dAlt = v.daten.alt || {}, dNeu = v.daten.neu || {};
  const rAlt = vglRechnung(dAlt, st), rNeu = vglRechnung(dNeu, st);

  const zeilen = [];
  VGL_GRUPPEN.forEach(g => {
    const items = g.items.map(([k,label,ziffer]) => {
      const a = vglNum(dAlt[k]), n = vglNum(dNeu[k]);
      return { key:k, label, ziffer, alt:a, neu:n, diff:n - a };
    }).filter(z => z.alt || z.neu);
    if(items.length) zeilen.push({ gruppe:g.titel, items });
  });

  const zeile = (label, a, n, stark) => ({ label, alt:a, neu:n,
    diff:(a === null || n === null) ? null : n - a, stark:!!stark });
  const ergebnis = [
    zeile("Total Einkünfte", rAlt.einkuenfte, rNeu.einkuenfte, true),
    zeile("Total Abzüge (Ziff. 11–18)", rAlt.abzuege, rNeu.abzuege),
    zeile("Nettoeinkommen", rAlt.netto, rNeu.netto, true),
    zeile("Weitere Abzüge (Ziff. 19–27)", rAlt.weitere, rNeu.weitere),
    zeile("Sozialabzüge Kanton", rAlt.sozKanton, rNeu.sozKanton),
    zeile("Steuerbares Einkommen Kanton/Gemeinde", rAlt.stbKanton, rNeu.stbKanton, true),
    zeile("Steuerbares Einkommen Bund", rAlt.stbBund, rNeu.stbBund),
    zeile("Steuerbares Vermögen", rAlt.stbVermoegen, rNeu.stbVermoegen)
  ];
  const steuern = rAlt.modus === "tarif" ? [
    zeile("Direkte Bundessteuer", rAlt.bund, rNeu.bund),
    zeile("Staatssteuer Kanton", rAlt.kanton, rNeu.kanton),
    zeile("Gemeindesteuer", rAlt.gemeinde, rNeu.gemeinde),
    zeile("Kirchensteuer", rAlt.kirche, rNeu.kirche),
    zeile("Total Steuerbelastung", rAlt.total, rNeu.total, true)
  ] : [];

  const szenarien = (v.szenarien || []).filter(s => vglNum(s.s3a) || vglNum(s.pk) || vglNum(s.weitere))
    .map(s => vglSzenario(dNeu, st, rNeu, s));
  const staffel = vglStaffelung(dNeu, st, rNeu, v.staffelBetrag, v.staffelJahre);

  /* Plausibilität und Pflichthinweise */
  const hinweise = [];
  const max3a = st.saeule3aMitPk;
  const total3a = vglNum(dNeu.a_saeule3a) + szenarien.reduce((a,s) => a + vglNum(s.s3a), 0);
  if(total3a > max3a)
    hinweise.push(`Säule 3a: erfasste und geplante Einzahlungen ergeben CHF ${chf(total3a)} – das Maximum mit Pensionskasse beträgt CHF ${chf(max3a)}.`);
  if(vglNum(dNeu.a_pkeinkauf) || szenarien.some(s => vglNum(s.pk)) || staffel)
    hinweise.push(`Einkauf Pensionskasse: Bei Kapitalbezug innert ${st.pkSperrfristJahre} Jahren nach dem Einkauf wird der Abzug verweigert bzw. aufgerechnet (Art. 79b Abs. 3 BVG).`);
  if(rNeu.ohneKantonstarif)
    hinweise.push(`Für den Kanton ${st.kanton} ist kein Tarif hinterlegt – ausgewiesen ist nur die direkte Bundessteuer. Für eine vollständige Rechnung den Grenzsatz-Modus verwenden.`);
  ["alt","neu"].forEach(seite => {
    const k = (v.kontroll || {})[seite];
    if(!k || !k.stbEinkommen) return;
    const r = seite === "alt" ? rAlt : rNeu, jr = seite === "alt" ? v.jahrAlt : v.jahrNeu;
    const ab = r.stbKanton - k.stbEinkommen;
    hinweise.push(`Abgleich ${jr} mit dem eingelesenen Beleg (${k.art || "Beleg"}): steuerbares Einkommen `
      + `laut Beleg CHF ${chf(k.stbEinkommen)}, hier berechnet CHF ${chf(r.stbKanton)}`
      + (Math.abs(ab) < 100 ? " – stimmt überein." : ` – Abweichung CHF ${chf(ab)}, bitte prüfen.`));
  });
  hinweise.push(rAlt.modus === "grenzsatz"
    ? `Grenzsatz-Modus: Die Steuerwirkung ist mit einem angenommenen Grenzsteuersatz von ${vglNum(st.grenzsatz)} % geschätzt – keine Veranlagungsberechnung.`
    : `Berechnung mit hinterlegten Tarifen (Stand ${TARIFE.meta.steuerjahr}, ${TARIFE.meta.stand}). Provisorische Berechnung – massgebend ist die Veranlagung des Steueramts.`);

  return { kunde:clientName(c), mandat:c.mandat || "", ort:[c.plz, c.ort].filter(Boolean).join(" "),
           kanzlei:S.settings.kanzlei, bearbeiter:S.settings.bearbeiter, datum:deAt(today()),
           jahrAlt:v.jahrAlt, jahrNeu:v.jahrNeu, stat:st, rAlt, rNeu,
           zeilen, ergebnis, steuern, szenarien, staffel, hinweise, notiz:v.notiz || "" };
}

/* ------------------------------------------------------------------
   WORD-EXPORT (.docx) – echtes Office-Format, ohne fremde Bibliothek.
   Gebaut wird ein OOXML-Paket, gezippt mit dem vorhandenen makeZip().
   ------------------------------------------------------------------ */
const xesc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                                 .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
/* Absatz: t=Text, b=fett, sz=Halbpunkt-Grösse, c=Farbe, al=Ausrichtung, sp=Abstand danach */
function wP(t, o = {}){
  const rPr = `<w:rPr>${o.b ? "<w:b/>" : ""}${o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : ""}`
            + `${o.c ? `<w:color w:val="${o.c}"/>` : ""}</w:rPr>`;
  return `<w:p><w:pPr>${o.al ? `<w:jc w:val="${o.al}"/>` : ""}`
       + `<w:spacing w:after="${o.sp ?? 80}"/>${rPr}</w:pPr>`
       + `<w:r>${rPr}<w:t xml:space="preserve">${xesc(t)}</w:t></w:r></w:p>`;
}
function wCell(t, o = {}){
  return `<w:tc><w:tcPr><w:tcW w:w="${o.w || 0}" w:type="dxa"/>`
       + `${o.fill ? `<w:shd w:val="clear" w:fill="${o.fill}"/>` : ""}</w:tcPr>`
       + wP(t, { b:o.b, sz:o.sz || 18, al:o.al, sp:0, c:o.c }) + `</w:tc>`;
}
/* rows: [{cells:[…], b, fill}] – cells sind Strings, align nach Spalte über `al` */
function wTable(rows, widths, al = []){
  const borders = ["top","left","bottom","right","insideH","insideV"]
    .map(p => `<w:${p} w:val="single" w:sz="4" w:color="C6CEDD"/>`).join("");
  const body = rows.map(r => `<w:tr>` + r.cells.map((t,i) =>
      wCell(t, { w:widths[i], b:r.b, fill:r.fill, al:al[i] || "left",
                 sz:r.sz || 18, c:r.c })).join("") + `</w:tr>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="9600" w:type="dxa"/>`
       + `<w:tblBorders>${borders}</w:tblBorders></w:tblPr>` + body + `</w:tbl>`
       + `<w:p><w:pPr><w:spacing w:after="120"/></w:pPr></w:p>`;
}
async function vglDocxBlob(b){

  const diffTxt = z => z.diff === null ? "–" : (z.diff > 0 ? "+" : "") + chf(z.diff);

  let body = "";
  body += wP(`Vergleich Steuererklärung ${b.jahrAlt} / ${b.jahrNeu}`, { b:true, sz:32, sp:60 });

  b.zeilen.forEach(g => {

  body += wP("Steuerbares Einkommen und Vermögen", { b:true, sz:24, sp:60 });

  if(b.steuern.length){

    body += wTable([{ cells:["", b.jahrAlt, b.jahrNeu, "Differenz"], b:true, fill:"EAF2FB" }]
      .concat(b.steuern.map(z => ({ cells:[z.label, f(z.alt), f(z.neu), diffTxt(z)], b:z.stark }))), W, ["left", ...NUM]);
    body += wP(`Grenzsteuersatz ${b.jahrNeu}: ${pz(b.rNeu.grenzsatz)} · Durchschnittssatz: ${pz(b.rNeu.durchschnitt || 0)}`,
               { sz:18, c:"54617A", sp:160 });
  }

  if(b.szenarien.length){
    body += wP("Wirkung zusätzlicher Einzahlungen", { b:true, sz:24, sp:60 });
    body += wTable([{ cells:["Variante","Säule 3a","PK-Einkauf","Einsatz","Steuerersparnis","Ersparnis in %"],
                      b:true, fill:"EAF2FB" }]
      .concat(b.szenarien.map(s => ({ cells:[s.label || "Variante", chf(vglNum(s.s3a)), chf(vglNum(s.pk)),
        chf(s.einsatz), chf(s.ersparnis), pz(s.quote)] }))),
      [2600, 1400, 1400, 1400, 1500, 1300], ["left","right","right","right","right","right"]);

  if(b.staffel){

    ], [4200, 2700, 2700], ["left","right","right"]);
  }

  if(b.notiz){ body += wP("Bemerkungen", { b:true, sz:24, sp:60 }); body += wP(b.notiz, { sz:20, sp:160 }); }
  body += wP("Hinweise", { b:true, sz:22, sp:60 });
  b.hinweise.forEach(h => body += wP("• " + h, { sz:17, c:"54617A", sp:40 }));

  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr>
</w:body></w:document>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;
  const drels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>
<w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
</w:styles>`;
  const enc = new TextEncoder();
  const zip = await makeZip([
    { name:"[Content_Types].xml",        data:enc.encode(types) },
    { name:"_rels/.rels",                data:enc.encode(rels) },
    { name:"word/_rels/document.xml.rels", data:enc.encode(drels) },
    { name:"word/document.xml",          data:enc.encode(doc) },
