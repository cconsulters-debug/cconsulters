[build]
  publish = "."
  command = "node scripts/build.mjs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Follow-up-Eskalation: prüft alle 10 Minuten auf unbearbeitete Leads (> 30 Min alt)
[functions."escalate-leads"]
  schedule = "*/10 * * * *"

# Saubere API-Pfade für die Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML nie hart cachen: geänderte Telefonnummern oder Preise müssen sofort greifen
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Erlaubt sind genau die Herkünfte, die die Seite tatsächlich nutzt:
    # Google Fonts, unpkg (Leaflet), CARTO (Kartenkacheln), Nominatim
    # (Reverse-Geocoding) und Firebase (Firestore/Storage/Auth).
    # 'unsafe-inline' bleibt nötig, solange Critical CSS und die kleinen
    # Seitenskripte inline im HTML stehen.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://unpkg.com https://firebasestorage.googleapis.com; connect-src 'self' https://nominatim.openstreetmap.org https://*.googleapis.com https://*.firebaseio.com; upgrade-insecure-requests"
